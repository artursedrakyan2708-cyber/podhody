<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Дневник силовых тренировок для Telegram: веса и повторы, подсказка прогрессии, таймер отдыха, графики.">
<title>Дневник подходов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Раскладка: журнал на один экран. Сверху дни программы и дата, ниже карточки упражнений, снизу закреплённые таймер отдыха и навигация из четырёх разделов. */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --surface-2: #F3F5F7;
  --ink: #14181D;
  --muted: #5A6672;
  --line: #D8DDE3;
  --accent: #2545C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FB;
  --good: #12703F;
  --good-soft: #DDF1E6;
  --warn: #855600;
  --warn-soft: #F8EBCB;
  --font-display: 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1114; --surface: #161A1F; --surface-2: #1D2228; --ink: #E8ECF0; --muted: #9AA5B0;
    --line: #2B323A; --accent: #8CA2FF; --accent-ink: #0E1114; --accent-soft: #232B4A;
    --good: #5BD199; --good-soft: #173528; --warn: #E6B95C; --warn-soft: #3A2F14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1114; --surface: #161A1F; --surface-2: #1D2228; --ink: #E8ECF0; --muted: #9AA5B0;
  --line: #2B323A; --accent: #8CA2FF; --accent-ink: #0E1114; --accent-soft: #232B4A;
  --good: #5BD199; --good-soft: #173528; --warn: #E6B95C; --warn-soft: #3A2F14;
  color-scheme: dark;
}
/* Цвет акцента из настроек: светлый вариант, затем тёмный */
:root[data-accent="violet"] { --accent: #6A3BD1; --accent-soft: #ECE5FB; }
:root[data-accent="green"] { --accent: #18794E; --accent-soft: #DCF0E4; }
:root[data-accent="orange"] { --accent: #B4510F; --accent-soft: #FBE8DA; }
:root[data-accent="pink"] { --accent: #B8326E; --accent-soft: #F9E1EC; }
:root[data-accent="graphite"] { --accent: #2E3A46; --accent-soft: #E1E6EB; }
:root[data-theme="dark"][data-accent="violet"] { --accent: #B39BFF; --accent-soft: #2C2450; }
:root[data-theme="dark"][data-accent="green"] { --accent: #5BD199; --accent-soft: #173528; }
:root[data-theme="dark"][data-accent="orange"] { --accent: #FFA45C; --accent-soft: #3D2716; }
:root[data-theme="dark"][data-accent="pink"] { --accent: #FF8DBE; --accent-soft: #42202F; }
:root[data-theme="dark"][data-accent="graphite"] { --accent: #C5CED8; --accent-soft: #2A3038; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="violet"] { --accent: #B39BFF; --accent-soft: #2C2450; }
  :root:not([data-theme="light"])[data-accent="green"] { --accent: #5BD199; --accent-soft: #173528; }
  :root:not([data-theme="light"])[data-accent="orange"] { --accent: #FFA45C; --accent-soft: #3D2716; }
  :root:not([data-theme="light"])[data-accent="pink"] { --accent: #FF8DBE; --accent-soft: #42202F; }
  :root:not([data-theme="light"])[data-accent="graphite"] { --accent: #C5CED8; --accent-soft: #2A3038; }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.4 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 88px;
  -webkit-tap-highlight-color: transparent;
}
body.has-rest { padding-block-end: 150px; }
body.setup { padding-block-end: 32px; }
button, input, textarea { font-family: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, .datechip:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.app { max-width: 620px; margin-inline: auto; }

/* Шапка */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
h1 { font: 600 22px/1.1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; margin: 0; }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status.err { color: var(--warn); }
.gear { flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); cursor: pointer; }
.gear[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.daybar { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; flex-wrap: wrap; flex: 1 1 220px; gap: 3px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card .seg { background: var(--surface-2); margin-top: 10px; }
.seg button { flex: 1 1 auto; min-width: 0; min-height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.datechip { position: relative; display: flex; align-items: center; min-height: 46px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; white-space: nowrap; }
.datechip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.note { margin: 0; padding: 8px 12px; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; }
.note.ok { color: var(--good); background: var(--good-soft); }
.card .note { margin: 8px 0 0; }

/* Общие блоки */
.ex, .card { margin-block-start: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.ex h2, .card h2 { margin: 0; font: 600 17px/1.25 var(--font-display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; min-width: 0; }
.card h3 { margin: 18px 0 2px; font-size: 14px; font-weight: 600; }
.card > summary { cursor: pointer; font-weight: 600; font-size: 14px; min-height: 28px; display: flex; align-items: center; }
.sub { margin: 2px 0 8px; font-size: 12.5px; color: var(--muted); }
.card .sub:last-child { margin-bottom: 0; }
.empty { margin: 10px 0 4px; color: var(--muted); font-size: 14px; }
.sect { margin: 20px 2px 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.foot { margin: 14px 2px 6px; font-size: 12.5px; color: var(--muted); }
.foot:empty { display: none; }
#vol { color: var(--ink); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.how { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--accent); }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--warn); }
.btn.danger.armed, .x.armed { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.wide { flex: 1 1 auto; }
.msg { margin: 8px 0 0; font-size: 13px; color: var(--warn); }
.msg.info { color: var(--muted); }
.msg:empty { display: none; }
.fi { min-width: 0; min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: 500 16px var(--font-body); }
.fi:focus { border-color: var(--accent); outline: none; }
textarea.fi { display: block; width: 100%; min-height: 64px; padding: 10px 12px; font: 400 16px/1.35 var(--font-body); resize: vertical; }
textarea.mono { font: 400 13px/1.35 ui-monospace, Menlo, Consolas, monospace; margin-top: 8px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; }
.fgrid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.fgrid .fi { width: 100%; font: 500 18px var(--font-display); text-align: center; }

/* Первый запуск и напоминания */
.hero h2 { font-size: 22px; }
.hero p { margin: 6px 0 0; font-size: 14.5px; }
.herotop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.herotop .seg { flex: 0 1 220px; margin: 0; }
.card.ask { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--surface) 70%); }
.tipline { display: flex; gap: 10px; align-items: baseline; margin-block-start: 12px; padding: 10px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 13.5px; }
.tag { flex: none; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tips { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 8px; font-size: 13.5px; }

/* Прогресс тренировки */
.wprog { display: flex; align-items: center; gap: 10px; margin-block-start: 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wbar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.wbar span { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--good); }

/* Карточка упражнения */
.ex { scroll-margin-top: 150px; }
.ex.done { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.pill { padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill:empty { display: none; }
.pill.ok { background: var(--good); color: var(--surface); }
.pill.pr { background: var(--accent-soft); color: var(--accent); }
.pill.up { background: var(--good-soft); color: var(--good); }
.pill.flat { background: var(--surface-2); color: var(--muted); }
.pill.down { background: var(--warn-soft); color: var(--warn); }
.prev { margin: 6px 0 10px; font-size: 13px; color: var(--muted); }
.sugg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.sugg.up { background: var(--good-soft); }
.sugg .tag { color: var(--muted); }
.sugg.up .tag { color: var(--good); }
.sugg .sv { font: 600 19px var(--font-display); font-variant-numeric: tabular-nums; }
.sugg .sw { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.sets { display: grid; gap: 4px; }
.row, .sethead { display: grid; grid-template-columns: 78px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.row { margin-inline: -6px; padding: 4px 6px; border-radius: 12px; }
.sethead { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sethead span:not(:first-child) { text-align: center; }
.lbl { font-size: 13px; font-weight: 600; }
.row.warm .lbl { font-weight: 500; color: var(--muted); }
.row.done { background: var(--good-soft); }
.row.done .lbl { color: var(--good); }
.row.done .lbl::before { content: '✓ '; }
.row.next { box-shadow: inset 0 0 0 2px var(--accent); }
.row:focus-within { background: var(--accent-soft); box-shadow: none; }
input.n { width: 100%; min-height: 46px; padding: 0 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: 500 20px var(--font-display); text-align: center; font-variant-numeric: tabular-nums; }
input.n::placeholder { color: var(--muted); opacity: .55; }
.row.warm input.n { background: transparent; border-style: dashed; font-size: 17px; }
.row.done input.n { background: var(--surface); border-color: var(--good); }
input.n:focus { border-color: var(--accent); border-width: 2px; background: var(--surface); outline: none; }
.feel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.feel .fl { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
.feel button { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink); font-size: 13px; cursor: pointer; }
.feel button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.acts:empty { display: none; }
details.nb { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
details.nb summary { display: flex; align-items: center; min-height: 34px; font-size: 13px; color: var(--muted); cursor: pointer; }
details.nb[open] summary { margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.inl { display: inline-flex; vertical-align: middle; }
.chipsgap { margin-top: 6px; }
.c { padding: 3px 8px; border-radius: 8px; background: var(--surface-2); font: 500 15px var(--font-display); font-variant-numeric: tabular-nums; }
.c.w { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.c.f { background: transparent; font: 500 12.5px var(--font-body); color: var(--muted); align-self: center; }
.bwtag { padding: 1px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font: 600 11px var(--font-body); letter-spacing: .02em; white-space: nowrap; vertical-align: middle; }

/* Таймер отдыха */
.rest { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 9; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--accent-soft); border-top: 1px solid var(--line); }
.rest.done { background: var(--good-soft); }
.rest-main { display: flex; align-items: baseline; gap: 10px; }
.rl { font-size: 13px; font-weight: 600; color: var(--muted); }
.rest.done .rl { color: var(--good); }
.rt { font: 600 28px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.rest-btns { display: flex; gap: 6px; }
.rest-btns button { min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }

/* Нижняя навигация */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 4px; height: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 48px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Графики */
svg.chart { display: block; width: 100%; height: auto; margin-top: 6px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .tick { fill: var(--muted); font: 11px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .area { fill: var(--accent); fill-opacity: .12; stroke: none; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .bar { fill: var(--accent); }
.chart .bar.met { fill: var(--good); }
.chart .bar.dim { fill-opacity: .45; }
.chart .vlbl { fill: var(--ink); font: 600 13px var(--font-display); }
.chart .hit { fill: transparent; cursor: pointer; }
.readout { margin: 8px 0 0; min-height: 2.8em; font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0 4px; }
.stats div { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); }
.stats dd { margin: 2px 0 0; font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats dd.ts { margin: 0; font: 500 11.5px var(--font-body); color: var(--muted); }
.stats dd.ts.up { color: var(--good); }
.tiles dd:not(.ts) { font-size: 22px; }
.hist { margin-top: 10px; }
.hrow { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.hd { font: 500 16px var(--font-display); }
.slist { display: grid; gap: 6px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); font-size: 14px; cursor: pointer; }
.srow[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sname { font-weight: 500; min-width: 0; }
.sright { text-align: right; }
.sval { font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.sd { display: block; font-size: 12px; color: var(--muted); }
.sd.up { color: var(--good); }

/* Обзор */
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
.dot { width: 34px; height: 8px; border-radius: 4px; background: var(--line); }
.dot.on { background: var(--accent); }
.big { margin: 0; font-size: 14.5px; }
.cal { display: grid; grid-template-columns: 42px repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.cal .ch { font-size: 11px; color: var(--muted); text-align: center; }
.cal .wl { align-self: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell { display: flex; align-items: center; justify-content: center; height: 36px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); color: var(--muted); font: 500 12px var(--font-body); font-variant-numeric: tabular-nums; cursor: pointer; overflow: hidden; }
.cell.on { background: var(--accent); color: var(--accent-ink); font: 600 13px var(--font-display); }
.cell.today { border-color: var(--accent); }
.cell.fut { background: transparent; opacity: .45; cursor: default; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 44px; padding: 4px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.lrow .lm { color: var(--muted); font-size: 12.5px; }
.lopen { min-height: 40px; padding: 0; border: 0; background: none; color: var(--ink); font-size: 14px; text-align: left; cursor: pointer; }
.x { min-width: 36px; height: 36px; padding: 0 6px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.x.armed { font-size: 13px; font-weight: 600; }
.bform { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.bform .fi { flex: 1 1 110px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* Настройки */
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border: 3px solid var(--surface); border-radius: 50%; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.swatch[data-sw="blue"] { background: #2545C4; }
.swatch[data-sw="violet"] { background: #6A3BD1; }
.swatch[data-sw="green"] { background: #18794E; }
.swatch[data-sw="orange"] { background: #D2691E; }
.swatch[data-sw="pink"] { background: #D23F82; }
.swatch[data-sw="graphite"] { background: #3C4A57; }

/* План */
.dayhead { display: flex; gap: 8px; align-items: center; margin: 22px 0 4px; }
.dayhead .fi { flex: 1 1 auto; font: 600 16px var(--font-body); }
.pe { display: grid; gap: 10px; margin-top: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pname { width: 100%; font-weight: 600; }
.pgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pgrid label { display: grid; gap: 4px; align-content: end; font-size: 11px; line-height: 1.2; color: var(--muted); min-width: 0; }
.pgrid .fi { width: 100%; min-height: 42px; padding: 0 2px; text-align: center; font: 500 17px var(--font-display); }
.prow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.chks { display: flex; flex-wrap: wrap; column-gap: 14px; }
.chk { display: flex; align-items: center; gap: 8px; min-height: 38px; font-size: 13.5px; cursor: pointer; }
.chk input { flex: none; width: 20px; height: 20px; accent-color: var(--accent); }
.pbtns { display: flex; gap: 6px; }
.ib { min-width: 40px; min-height: 38px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--ink); font-size: 15px; cursor: pointer; white-space: nowrap; }
.ib:disabled { opacity: .35; cursor: default; }
.ib.danger { color: var(--warn); font-size: 13px; font-weight: 600; }
.ib.danger.armed { background: var(--warn-soft); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; font-size: 13.5px; }
.field .fi { width: 76px; text-align: center; }
.picker { margin-top: 8px; padding: 12px; border: 1px dashed var(--accent); border-radius: 12px; background: var(--surface); }
.qchips { display: flex; flex-wrap: wrap; gap: 6px; }
.qchip { min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink); font-size: 13.5px; cursor: pointer; }
@media (max-width: 380px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

@media (prefers-reduced-motion: no-preference) {
  .seg button, .srow, .feel button, .cell, .row, .ex, input.n, .wbar span, .qchip { transition: background-color .15s, border-color .15s, box-shadow .15s, width .3s; }
}
</style>

  var noteDirty = {}, bodyYears = {}, storedDays = {};
  var chain = Promise.resolve();
  var armed = null;

  var $view = document.getElementById('view');
  var $status = document.getElementById('status');
  var $note = document.getElementById('note');
  var $datein = document.getElementById('datein');
  var $seg = document.getElementById('seg');

  /* ---------- утилиты ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function dt(s) { return new Date(s + 'T12:00:00'); }
  function addDays(s, n) { var d = dt(s); d.setDate(d.getDate() + n); return ymd(d); }
  function weekStart(s) { var d = dt(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }
  function curId() { return cur.date + '_d' + cur.day; }
  function nf(n) { return Math.round(n).toLocaleString(loc()); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function parseNum(s) { var v = parseFloat(String(s).replace(',', '.')); return isFinite(v) && v >= 0 ? v : null; }
  function shortDate(s) { return s.slice(8, 10) + '.' + s.slice(5, 7); }
  function longDate(s) { return dt(s).toLocaleDateString(loc(), { day: 'numeric', month: 'long' }); }
  function chipDate(s) { return dt(s).toLocaleDateString(loc(), { weekday: 'short', day: 'numeric', month: 'long' }); }
  function wdNames() {
    var out = [];
    for (var i = 0; i < 7; i++) { var s = dt(addDays('2024-01-01', i)).toLocaleDateString(loc(), { weekday: 'short' }); out.push(s.charAt(0).toUpperCase() + s.slice(1)); }
    return out;
  }
  function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function blank(n) { var s = []; for (var i = 0; i < (n || 3); i++) s.push(cell0()); return { w: cell0(), s: s, feel: null }; }
  function ensure(e, n) { while (e.s.length < n) e.s.push(cell0()); return e; }
  function isDone(ex, c) { return !!c && (ex && ex.bw ? c.reps != null : c.kg != null && c.reps != null); }
  function signed(d, unit) { return (d > 0 ? '+' : d < 0 ? '−' : '±') + fmt(Math.abs(d)) + (unit ? ' ' + unit : ''); }
  function pct(a, b) { var d = Math.round((a - b) / b * 100); return (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d) + '%'; }
  function cellText(c, bw) {
    if (!c) return '';
    if (c.kg == null) return c.reps == null ? '' : t('chip_reps', { n: fmt(c.reps) });
    return (bw ? '+' : '') + fmt(c.kg) + '×' + (c.reps == null ? '?' : fmt(c.reps));
  }
  function chipsHtml(e, withFeel, bw) {
    e = norm(e);
    var out = '';
    if (filled(e.w)) out += '<span class="c w" title="' + esc(t('warmup')) + '">' + t('warm_short') + ' ' + cellText(e.w, bw) + '</span>';
    e.s.forEach(function (c) { if (filled(c)) out += '<span class="c">' + cellText(c, bw) + '</span>'; });
    if (withFeel && e.feel) out += '<span class="c f">' + feelName(e.feel).toLowerCase() + '</span>';
    return out;
  }
  function lastBody() { return BODY.items.length ? BODY.items[BODY.items.length - 1] : null; }
  function addBody(d, kg) {
    BODY.items = BODY.items.filter(function (x) { return x.date !== d; });
    BODY.items.push({ date: d, kg: r2(kg) });
    BODY.items.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    bodyYears[d.slice(0, 4)] = 1;
    sel.body = null;
    scheduleSave('body');
  }
  function validKg(v) { return v != null && v >= 25 && v <= 300; }
  function validH(v) { return v != null && v >= 100 && v <= 250; }

  /* ---------- история ---------- */
  function sessionsSorted() {
    return Object.keys(S).map(function (id) { return { id: id, doc: S[id] }; })
      .filter(function (x) { return x.doc && x.doc.date && x.doc.entries; })
      .sort(function (a, b) { return a.doc.date < b.doc.date ? -1 : a.doc.date > b.doc.date ? 1 : (a.id < b.id ? -1 : 1); });
  }
  function history(exId) {
    var out = [], bw = isBw(exId);
    sessionsSorted().forEach(function (x) {
      var e = x.doc.entries[exId];
      if (!e || !Core.has(e, bw)) return;
      var n = norm(e);
      out.push({ id: x.id, date: x.doc.date, entry: n, kg: topKg(n), reps: topReps(n) });
    });
    return out;
  }
  function prevEntry(exId) {
    var h = history(exId).filter(function (p) { return p.id !== curId() && p.date <= cur.date; });
    return h.length ? h[h.length - 1] : null;
  }
  function records(exId, excludeId, maxDate) {
    var b = { kg: null, e1: null, reps: null, n: 0 };
    history(exId).forEach(function (p) {
      if (p.id === excludeId || (maxDate && p.date > maxDate)) return;
      b.n++;
      var o = bestOf(p.entry);
      if (o.kg != null && (b.kg == null || o.kg > b.kg)) b.kg = o.kg;
      if (o.e1 != null && (b.e1 == null || o.e1 > b.e1)) b.e1 = o.e1;
      if (p.reps != null && (b.reps == null || p.reps > b.reps)) b.reps = p.reps;
    });
    return b;
  }
  function mult(id) { return BYID[id] && BYID[id].dumbbell ? 2 : 1; }
  function sessVolume(entries) {
    var v = 0;
    Object.keys(entries || {}).forEach(function (k) { v += Core.volume(entries[k], mult(k)); });
    return Math.round(v);
  }
  function prevSameDay() {
    var l = sessionsSorted().filter(function (x) { return x.doc.day === cur.day && x.id !== curId() && x.doc.date <= cur.date; });
    return l.length ? l[l.length - 1] : null;
  }
  function nextDay() {
    var l = sessionsSorted();
    if (!l.length) return PLAN.days[0].id;
    var i = dayIndex(l[l.length - 1].doc.day);
    return PLAN.days[(i + 1) % PLAN.days.length].id;
  }
  function suggest(ex, prev) { return Core.suggest(ex, prev, PREFS.lang); }

  /* ---------- черновик текущей тренировки ---------- */
  function loadDraft() {
    var doc = S[curId()];
    draft = {}; extra = {};
    if (doc && doc.entries) Object.keys(doc.entries).forEach(function (k) { draft[k] = norm(doc.entries[k]); });
    dirty = false;
  }
  function buildDoc() {
    var entries = {}, any = false;
    Object.keys(draft).forEach(function (k) {
      var e = draft[k], lf = lastFilled(e);
      if (filled(e.w) || lf >= 0) {
        entries[k] = { w: e.w, s: e.s.slice(0, lf + 1), feel: e.feel };
        any = true;
      }
    });
    return any ? { date: cur.date, day: cur.day, entries: entries } : null;
  }

  /* ---------- сохранение ---------- */
  function anyPending() { return pend.sess || pend.plan || pend.body || pend.prefs; }
  function setStatus(kind, text) {
    $status.className = '';
    if (kind === 'connecting') $status.textContent = t('st_loading');
    else if (kind === 'saving') $status.textContent = t('st_saving');
    else if (kind === 'error') { $status.textContent = text || t('st_err'); $status.className = 'err'; }
    else $status.textContent = mode === 'tg' ? t('st_saved') : mode === 'local' ? t('st_saved_local') : mode === 'memory' ? t('st_nosave') : t('st_loading');
  }
  function scheduleSave(kind) {
    pend[kind] = true;
    setStatus('saving');
    closingGuard(true);
    clearTimeout(timers[kind]);
    timers[kind] = setTimeout(function () { flush(kind); }, 700);
  }
  function planJob() {
    var cfg = JSON.stringify({
      v: 2, autoTimer: PLAN.autoTimer, goal: PLAN.goal, oldDays: PLAN.oldDays,
      order: PLAN.days.map(function (d) { return { id: d.id, name: d.name }; }),
      archive: PLAN.archive.map(function (e) { return strip(e, false); })
    });
    var days = PLAN.days.map(function (d) { return ['cfg_day' + d.id, JSON.stringify({ ex: d.ex.map(function (e) { return strip(e, false); }) })]; });
    var now = {};
    PLAN.days.forEach(function (d) { now[d.id] = 1; });
    var dels = Object.keys(storedDays).filter(function (id) { return !now[id]; }).map(function (id) { return 'cfg_day' + id; });
    storedDays = now;
    var notes = noteDirty; noteDirty = {};
    return function () {
      var pr = kvSet('cfg_plan', cfg);
      days.forEach(function (d) { pr = pr.then(function () { return kvSet(d[0], d[1]); }); });
      dels.forEach(function (k) { pr = pr.then(function () { return KV.del(k); }); });
      Object.keys(notes).forEach(function (id) { pr = pr.then(function () { return notes[id] ? kvSet('n_' + id, notes[id]) : KV.del('n_' + id); }); });
      return pr;
    };
  }
  function bodyJob() {
    var ys = bodyYears; bodyYears = {};
    var parts = {};
    Object.keys(ys).forEach(function (y) {
      parts[y] = BODY.items.filter(function (x) { return x.date.slice(0, 4) === y; }).map(function (x) { return [x.date, x.kg]; });
    });
    return function () {
      return Object.keys(parts).reduce(function (pr, y) {
        return pr.then(function () { return parts[y].length ? kvSet('b_' + y, JSON.stringify(parts[y])) : KV.del('b_' + y); });
      }, Promise.resolve());
    };
  }
  function runJob(job) {
    chain = chain.then(job)
      .then(function () { if (!anyPending()) { setStatus('saved'); closingGuard(false); } })
      .catch(function (err) {
        console.error(err);
        setStatus('error', err && err.tooBig ? t('st_toobig') : t('st_err'));
      });
  }
  function flush(kind) {
    clearTimeout(timers[kind]);
    timers[kind] = null;
    if (!pend[kind]) return;
    if (mode === 'pending') { timers[kind] = setTimeout(function () { flush(kind); }, 800); return; }
    if (mode === 'failed') return;
    pend[kind] = false;
    var job;
    if (kind === 'sess') {
      var id = curId(), doc = buildDoc();
      if (doc) S[id] = doc; else delete S[id];
      job = function () { return doc ? kvSet('s_' + id, enc(doc)) : KV.del('s_' + id); };
    } else if (kind === 'plan') job = planJob();
    else if (kind === 'prefs') { var pj = JSON.stringify(PREFS); job = function () { return kvSet('cfg_prefs', pj); }; }
    else job = bodyJob();
    runJob(job);
  }
  function flushAll() { ['sess', 'plan', 'body', 'prefs'].forEach(flush); }
  function savePrefs() { cachePrefs(); scheduleSave('prefs'); }
  var noteT = null;
  function showNote(okText) {
    var tx = '', ok = false;
    clearTimeout(noteT);
    if (okText) { tx = okText; ok = true; noteT = setTimeout(function () { showNote(); }, 6000); }
    else if (mode === 'failed') tx = t('nt_failed');
    else if (mode === 'memory') tx = t('nt_memory');
    else if (mode === 'local' && inTg) tx = t('nt_oldtg');
    else if (mode === 'local') tx = t('nt_browser');
    $note.textContent = tx;
    $note.className = 'note' + (ok ? ' ok' : '');
    $note.hidden = !tx;
    if (!okText) { if (mode === 'failed') setStatus('error', t('st_nostore')); else setStatus('saved'); }
  }

  /* ---------- загрузка ---------- */
  function loadAll() {
    return KV.keys().then(getAll).then(function (v) {
      var next = {}, cfg = null, rawDays = {}, notes = {}, body = [], prefs = null;
      Object.keys(v).forEach(function (k) {
        var s = v[k];
        if (s == null || s === '') return;
        try {
          if (k.indexOf('s_') === 0) { var d = dec(s); if (isDate(d.date)) next[k.slice(2)] = d; }
          else if (k === 'cfg_plan') cfg = JSON.parse(s);
          else if (k === 'cfg_prefs') prefs = JSON.parse(s);
          else if (/^cfg_day\d+$/.test(k)) rawDays[+k.slice(7)] = JSON.parse(s);
          else if (k.indexOf('n_') === 0) notes[k.slice(2)] = s;
          else if (k.indexOf('b_') === 0) JSON.parse(s).forEach(function (a) { if (a && isDate(a[0]) && isFinite(+a[1])) body.push({ date: a[0], kg: +a[1] }); });
        } catch (e) { console.warn('Пропущена запись', k); }
      });
      if (prefs) { PREFS = cleanPrefs(prefs); cachePrefs(); }
      S = next;
      storedDays = {};
      Object.keys(rawDays).forEach(function (id) { storedDays[id] = 1; });
      var p = null;
      if (cfg || Object.keys(rawDays).length) {
        var order = cfg && Array.isArray(cfg.order) ? cfg.order
          : Object.keys(rawDays).map(Number).sort(function (a, b) { return a - b; }).map(function (id) { return { id: id }; });
        p = {
          autoTimer: cfg ? cfg.autoTimer : true, goal: cfg ? cfg.goal : null,
          archive: cfg && cfg.archive || [], oldDays: cfg && cfg.oldDays || {},
          days: order.map(function (o) { return { id: o.id, name: o.name, ex: (rawDays[o.id] || {}).ex || [] }; })
        };
      }
      var cp = cleanPlan(p);
      setup = !cp && !Object.keys(S).length;
      PLAN = cp || cleanPlan(setup ? emptyPlan() : legacyPlan());
      reindex();
      Object.keys(notes).forEach(function (id) { if (BYID[id]) BYID[id].note = notes[id].slice(0, 500); });
      BODY = { items: body.sort(function (a, b) { return a.date < b.date ? -1 : 1; }) };
    });
  }
  function pickDefaults() {
    if (!userChose && !dirty) {
      var list = sessionsSorted();
      var today = list.filter(function (x) { return x.doc.date === cur.date; });
      if (today.length) cur.day = today[today.length - 1].doc.day;
      else cur.day = nextDay();
    }
    if (dayIndex(cur.day) < 0 && !S[curId()]) cur.day = PLAN.days[0].id;
    if (!selEx) {
      var l = sessionsSorted();
      for (var i = l.length - 1; i >= 0 && !selEx; i--) {
        var keys = Object.keys(l[i].doc.entries);
        for (var j = 0; j < keys.length; j++) { if (BYID[keys[j]] && history(keys[j]).length) { selEx = keys[j]; break; } }
      }
    }
  }
  function boot() {
    applyTheme();
    applyStatic();
    if (inTg) {
      try { tg.ready(); tg.expand(); } catch (e) { /* старая версия */ }
      try { if (tgAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) { /* старая версия */ }
      try { tg.onEvent('themeChanged', applyTheme); } catch (e) { /* старая версия */ }
    }
    $view.innerHTML = '<section class="card"><p class="empty">' + t('loading_records') + '</p></section>';
    document.getElementById('tabs').hidden = true;
    document.getElementById('daybar').hidden = true;
    document.getElementById('setbtn').hidden = true;
    setStatus('connecting');
    loadAll().then(function () {
      mode = useCloud ? 'tg' : (KV.ok === false ? 'memory' : 'local');
      applyTheme();
      applyStatic();
      showNote();
      pickDefaults();
      loadDraft();
      renderAll();
    }).catch(function (err) {
      console.error(err);
      mode = 'failed';
      showNote();
      $view.innerHTML = '';
    });
  }

  /* ---------- шапка и вкладки ---------- */
  function renderTop() {
    document.body.classList.toggle('setup', setup);
    document.getElementById('tabs').hidden = setup;
    document.getElementById('setbtn').hidden = setup;
    document.getElementById('setbtn').setAttribute('aria-pressed', String(tab === 'set'));
    document.getElementById('daybar').hidden = setup || tab !== 'log';
    $seg.innerHTML = PLAN.days.map(function (d) {
      return '<button type="button" data-day="' + d.id + '" aria-pressed="' + (d.id === cur.day) + '">' + esc(d.name) + '</button>';
    }).join('');
    document.getElementById('datelbl').textContent = chipDate(cur.date);
    $datein.value = cur.date;
    $datein.max = todayStr();
    ['log', 'prog', 'over', 'plan'].forEach(function (x) {
      document.getElementById('tab-' + x).setAttribute('aria-current', tab === x ? 'page' : 'false');
    });
  }
  function renderTab() {
    if (setup) renderSetup();
    else if (tab === 'log') renderLog();
    else if (tab === 'prog') renderProg();
    else if (tab === 'over') renderOver();
    else if (tab === 'set') renderSettings();
    else renderPlan();
  }
  function renderAll() { renderTop(); renderTab(); }
  function segHtml(attr, items, curV, label) {
    return '<div class="seg" role="group" aria-label="' + esc(label) + '">' + items.map(function (it) {
      return '<button type="button" ' + attr + '="' + it[0] + '" aria-pressed="' + (it[0] === curV) + '">' + esc(it[1]) + '</button>';
    }).join('') + '</div>';
  }
  function langSeg() { return segHtml('data-lang', [['ru', 'Русский'], ['en', 'English']], PREFS.lang, t('set_lang')); }

  /* ---------- первый запуск ---------- */
  function renderSetup() {
    var last = lastBody();
    $view.innerHTML = '<section class="card hero"><div class="herotop"><h2>' + t('welcome') + '</h2>' + langSeg() + '</div><p>' + t('welcome_p') + '</p></section>' +
      '<form class="card" id="setupform"><h2>' + t('about_you') + '</h2><p class="sub">' + t('about_you_sub') + '</p>' +
      '<div class="fgrid"><label>' + t('height_cm') + '<input class="fi" id="su_h" type="text" inputmode="numeric" autocomplete="off" value="' + (PREFS.height || '') + '" placeholder="175"></label>' +
      '<label>' + t('weight_kg') + '<input class="fi" id="su_kg" type="text" inputmode="decimal" autocomplete="off" value="' + (last ? fmt(last.kg) : '') + '" placeholder="70"></label>' +
      '<label>' + t('goal_week') + '<input class="fi" id="su_goal" type="text" inputmode="numeric" autocomplete="off" value="3"></label></div>' +
      '<p class="msg" id="sumsg"></p><div class="btnrow"><button type="submit" class="btn wide">' + t('start') + '</button></div></form>' +
      '<section class="card"><h2>' + t('how_title') + '</h2><ul class="how"><li>' + t('how1') + '</li><li>' + t('how2') + '</li><li>' + t('how3') + '</li></ul></section>' +
      '<details class="card"><summary>' + t('have_backup') + '</summary>' +
      '<p class="sub">' + t('backup_paste') + '</p>' +
      '<textarea class="fi mono" id="impbox" rows="3" placeholder="' + esc(t('paste_here')) + '" aria-label="' + esc(t('import_aria')) + '"></textarea>' +
      '<div class="btnrow"><button type="button" class="btn" data-import="1">' + t('load') + '</button></div><p class="msg" id="imsg"></p></details>';
  }
  function finishSetup() {
    var h = parseNum(document.getElementById('su_h').value), kg = parseNum(document.getElementById('su_kg').value);
    var g = parseNum(document.getElementById('su_goal').value), m = document.getElementById('sumsg');
    if (!validH(h)) { m.textContent = t('err_height'); return; }
    if (!validKg(kg)) { m.textContent = t('err_weight'); return; }
    PREFS.height = Math.round(h);
    savePrefs();
    addBody(todayStr(), kg);
    var p = emptyPlan();
    p.goal = num(g, 1, 7, 3, true);
    PLAN = cleanPlan(p);
    reindex();
    scheduleSave('plan');
    setup = false;
    cur.day = PLAN.days[0].id;
    userChose = true;
    tab = 'plan';
    pickDay = PLAN.days[0].id;
    loadDraft();
    renderAll();
    window.scrollTo(0, 0);
    haptic('done');
  }

  /* ---------- советы ---------- */
  function tipsCtx() {
    var list = sessionsSorted(), today = todayStr(), tw = weekStart(today), wc = 0, up = 0, stall = [];
    list.forEach(function (x) { if (x.doc.date >= tw) wc++; });
    ALL.forEach(function (ex) {
      var h = history(ex.id);
      if (!h.length) return;
      var sg = suggest(ex, h[h.length - 1]);
      if (sg && sg.kind === 'up') up++;
      if (!ex.bw && Core.stalled(h)) stall.push(ex.name);
    });
    var lb = lastBody(), due = Core.weighDue(BODY.items, today);
    return {
      today: today, total: list.length, last: list.length ? list[list.length - 1].doc.date : null,
      week: wc, goal: PLAN.goal, dow: (dt(today).getDay() + 6) % 7,
      weighDays: PREFS.remind ? due.days : -1, kg: lb ? lb.kg : null, up: up, stalled: stall
    };
  }
  function tipsList() { return Core.tips(tipsCtx(), PREFS.lang); }

  /* ---------- тренировка ---------- */
  function rowHtml(ex, slot, label, warm, cell, phKg, phReps, last) {
    var done = isDone(ex, cell);
    var kgLabel = label + ', ' + (ex.bw ? t('extra_kg') : t('kg')) + (ex.dumbbell ? ' ' + t('per_db') : '');
    function inp(f, val, ph, im) {
      return '<input class="n" id="i_' + ex.id + '_' + slot + '_' + f + '" data-ex="' + ex.id + '" data-slot="' + slot + '" data-f="' + f + '" type="text" inputmode="' + im + '" autocomplete="off" enterkeyhint="next" aria-label="' + esc(f === 'kg' ? kgLabel : label + ', ' + t('reps_l')) + '" placeholder="' + (ph == null ? '–' : fmt(ph)) + '" value="' + fmt(val) + '">';
    }
    var a = inp('kg', cell.kg, phKg, 'decimal'), b = inp('reps', cell.reps, phReps, 'numeric');
    return '<div class="row' + (warm ? ' warm' : '') + (done ? ' done' : '') + '" data-timed="' + (done ? '1' : '') + '"' + (last ? ' data-last="1"' : '') + '><span class="lbl">' + label + '</span>' +
      (ex.bw ? b + a : a + b) + '</div>';
  }
  function rowsFor(ex, e) { return Math.min(MAXSETS, Math.max(ex.sets + (extra[ex.id] || 0), lastFilled(e) + 1)); }
  function sgValue(ex, sg) {
    if (ex.bw) return sg.kg > 0 ? '+' + fmt(sg.kg) + ' ' + t('kg') + ' × ' + sg.reps : t('bw_x', { n: sg.reps });
    return fmt(sg.kg) + ' ' + t('kg') + ' × ' + sg.reps;
  }
  function exCard(ex) {
    var prev = prevEntry(ex.id);
    var sg = suggest(ex, prev);
    var e = draft[ex.id] || blank(ex.sets);
    var n = rowsFor(ex, e);
    ensure(e, n);
    var prevLine = prev
      ? t('last_time', { d: shortDate(prev.date) }) + ' <span class="chips inl">' + chipsHtml(prev.entry, true, ex.bw) + '</span>'
      : t('no_records');
    var sgHtml = sg

  /* ---------- графики ---------- */
  function lineChart(pts, key, si, unit, steps, aria) {
    var W = 360, H = 214, L = 40, R = 18, Tp = 30, B = 30;
    var vs = pts.map(function (p) { return p.v; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    var y0 = 0, y1 = 1, step = steps[0];
    for (var i = 0; i < steps.length; i++) {
      var s = steps[i];
      var a = Math.floor(lo / s) * s; if (a === lo) a -= s;
      var b = Math.ceil(hi / s) * s; if (b === hi) b += s;
      a = Math.max(0, a);
      y0 = a; y1 = b; step = s;
      if ((b - a) / s <= 5) break;
    }
    var tt = pts.map(function (p) { return dt(p.date).getTime(); });
    var tmin = Math.min.apply(null, tt), tmax = Math.max.apply(null, tt);
    function X(i) { return tmax === tmin ? (L + W - R) / 2 : L + (tt[i] - tmin) / (tmax - tmin) * (W - L - R); }
    function Y(v) { return Tp + (1 - (v - y0) / (y1 - y0)) * (H - Tp - B); }

    for (var v = y0; v <= y1 + 1e-9; v += step) {
      g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"></line>' +
        '<text class="tick" x="' + (L - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + (step >= 100 ? nf(v) : fmt(v)) + '</text>';
    }
    var xy = pts.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p.v).toFixed(1); });
    var base = Y(y0).toFixed(1);
    var area = pts.length > 1 ? '<polygon class="area" points="' + X(0).toFixed(1) + ',' + base + ' ' + xy.join(' ') + ' ' + X(pts.length - 1).toFixed(1) + ',' + base + '"></polygon>' : '';
    var line = pts.length > 1 ? '<polyline class="ln" points="' + xy.join(' ') + '"></polyline>' : '';
    var dots = '', hits = '';
    pts.forEach(function (p, i) {
      dots += '<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (i === si ? 5.5 : 3.5) + '"></circle>';

    });

    var xl = pts.length === 1
      ? '<text class="tick" x="' + X(0).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + shortDate(pts[0].date) + '</text>'
      : '<text class="tick" x="' + X(0).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="start">' + shortDate(pts[0].date) + '</text>' +

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">' + g + area + line + dots + lbl + xl + hits + '</svg>';
  }
  function barPath(x, y, w, h) {

  function barChart(items, si, key, aria, goal) {

    var n30 = list.filter(function (x) { return x.doc.date >= m30; }).length;
    var wk = Core.weeks(list, today, 2, function (d) { return sessVolume(d.entries); });
    var wv = wk[1].vol, pv = wk[0].vol;
    var prs = Core.prCount(list, m30, isBw);
    var lb = lastBody(), b30 = BODY.items.filter(function (x) { return x.date <= m30; }), base = b30.length ? b30[b30.length - 1] : (BODY.items[0] || null);
    var bmi = lb && PREFS.height ? Core.bmi(PREFS.height, lb.kg) : null;
    var dk = lb && base && base !== lb ? r2(lb.kg - base.kg) : null;
    return '<section class="card"><h2>' + t('dash') + '</h2><dl class="stats tiles">' +
      tile(t('d_total'), list.length) +
      tile(t('d_30'), n30) +
      tile(t('d_week_vol'), wv ? nf(wv) : '–', pv ? pct(wv, pv) + ' ' + t('d_vs_prev') : '', wv > pv ? 'up' : '') +
      tile(t('d_prs'), prs, t('d_prs_sub')) +
      tile(t('d_body'), lb ? fmt(lb.kg) + ' ' + t('kg') : '–', dk != null ? signed(dk, t('kg')) : '') +
      tile(t('d_bmi'), bmi != null ? fmt(bmi) : '–', bmi != null ? t(Core.bmiCat(bmi)) : (PREFS.height ? '' : t('d_bmi_need'))) +
      '</dl></section>';
  }
  function weeksCard() {
    var list = sessionsSorted();
    if (!list.length) return '';
    var wk = Core.weeks(list, todayStr(), 8, function (d) { return sessVolume(d.entries); });
    var m = metric.wk;
    var items = wk.map(function (w) { return { v: m === 'vol' ? Math.round(w.vol) : m === 'cnt' ? w.count : w.sets, l1: shortDate(w.start), l2: '' }; });
    if (sel.wk == null || sel.wk >= items.length) sel.wk = items.length - 1;
    var s = wk[sel.wk], it = items[sel.wk];
    var val = m === 'vol' ? nf(it.v) + ' ' + t('kg') : m === 'cnt' ? tn('n_workouts', it.v) : tn('n_sets', it.v);
    return '<section class="card"><h2>' + t('by_weeks') + '</h2>' +
      segHtml('data-wkm', [['vol', t('m_vol')], ['cnt', t('m_cnt')], ['sets', t('m_sets')]], m, t('by_weeks')) +
      barChart(items, sel.wk, 'wk', t('by_weeks'), m === 'cnt' ? PLAN.goal : 0) +
      '<p class="readout"><strong>' + t('week_of', { d: longDate(s.start) }) + '</strong> · ' + val + (m === 'cnt' ? ' · ' + t('goal_is', { n: PLAN.goal }) : '') + '</p></section>';
  }
  function tipsCard() {
    var list = tipsList().slice(0, 4);
    return '<section class="card"><h2>' + t('tips') + '</h2><ul class="tips">' + list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
  }
  function srow(e) {
    var hh = history(e.id), bw = e.bw;
    var last = hh.length ? hh[hh.length - 1] : null, first = hh.length ? hh[0] : null;
    var lv = last ? (bw ? last.reps : last.kg) : null, fv = first ? (bw ? first.reps : first.kg) : null;
    var d = (last && hh.length > 1 && lv != null && fv != null) ? r2(lv - fv) : null;
    var unit = bw ? t('reps_u') : t('kg');
    var dtxt = d == null ? (last ? t('first_rec') : t('no_rec')) : d === 0 ? t('no_change') : t('since_start', { d: signed(d, unit) });
    return '<button type="button" class="srow" data-sel="' + e.id + '" aria-pressed="' + (e.id === selEx) + '">' +
      '<span class="sname">' + esc(e.name) + (bw ? ' <span class="bwtag">' + t('bw_tag') + '</span>' : '') + '</span>' +
      '<span class="sright"><span class="sval">' + (lv != null ? fmt(lv) : '–') + '</span><span class="sd' + (d > 0 ? ' up' : '') + '">' + dtxt + '</span></span></button>';
  }
  function exMetrics(ex) { return ex.bw ? [['reps', t('m_maxreps')], ['tot', t('m_totreps')]] : [['kg', t('m_kg')], ['e1', t('m_e1')], ['vol', t('m_vol')]]; }
  function metricVal(ex, p, m) {
    if (m === 'reps') return p.reps;
    if (m === 'tot') return Core.sumReps(p.entry);
    if (m === 'e1') { var b = bestOf(p.entry).e1; return b == null ? null : Math.round(b * 2) / 2; }
    if (m === 'vol') return Math.round(Core.volume(p.entry, mult(ex.id)));
    return p.kg;
  }
  function exCardProg() {
    var ex = BYID[selEx], h = history(selEx);
    var ms = exMetrics(ex);
    if (!ms.some(function (x) { return x[0] === metric.ex; })) metric.ex = ms[0][0];
    var m = metric.ex;
    var pts = h.map(function (x) { return { date: x.date, v: metricVal(ex, x, m), p: x }; }).filter(function (x) { return x.v != null; });
    if (sel.ex == null || sel.ex >= pts.length) sel.ex = pts.length - 1;
    var body;
    if (!h.length) {
      body = '<p class="empty">' + t('ex_norec') + '</p>';
    } else {
      var rec = records(selEx);
      var stats = ex.bw
        ? '<dl class="stats">' + tile(t('best_reps'), rec.reps != null ? fmt(rec.reps) : '–') + tile(t('best_kg_extra'), rec.kg != null ? '+' + fmt(rec.kg) + ' ' + t('kg') : '–') + tile(t('workouts'), rec.n) + '</dl>'
        : '<dl class="stats">' + tile(t('best_kg'), fmt(rec.kg) + ' ' + t('kg')) + tile(t('e1rm'), rec.e1 != null ? '≈' + fmt(Math.round(rec.e1 * 2) / 2) + ' ' + t('kg') : '–') + tile(t('workouts'), rec.n) + '</dl>';
      var unit = m === 'reps' || m === 'tot' ? t('reps_u') : t('kg');
      var steps = m === 'vol' ? [100, 250, 500, 1000, 2000, 5000] : m === 'reps' || m === 'tot' ? [1, 2, 5, 10, 20, 50] : [1, 2.5, 5, 10, 20, 25, 50];
      var chart = pts.length ? lineChart(pts, 'ex', sel.ex, unit, steps, ex.name) : '<p class="empty">' + t('no_data_metric') + '</p>';
      var sp = pts.length ? pts[sel.ex].p : null;
      body = stats + segHtml('data-exm', ms, m, t('metric')) + chart +
        (sp ? '<p class="readout"><strong>' + longDate(sp.date) + '</strong><br><span class="chips chipsgap">' + chipsHtml(sp.entry, true, ex.bw) + '</span></p>' : '') +
        '<div class="hist">' + h.slice().reverse().map(function (x) {
          return '<div class="hrow"><span class="hd">' + shortDate(x.date) + '</span><span class="chips">' + chipsHtml(x.entry, true, ex.bw) + '</span></div>';
        }).join('') + '</div>';
    }
    var where = inArchive(ex.id) ? t('archived') : esc(dayById(ex.day).name);
    return '<section class="card" id="excard"><h2>' + esc(ex.name) + '</h2><p class="sub">' + where + (ex.dumbbell ? ' · ' + t('one_db') : '') + (ex.bw ? '' : ' · ' + t('e1_note')) + '</p>' + body + '</section>';
  }
  function renderProg() {
    if (!selEx || !BYID[selEx]) selEx = ALL.length ? ALL[0].id : null;
    var top = dashCard() + weeksCard() + tipsCard();
    if (!selEx) { $view.innerHTML = top + '<section class="card"><p class="empty">' + t('plan_noex') + '</p></section>'; return; }
    var lists = PLAN.days.map(function (d) {
      return d.ex.length ? '<p class="sect">' + esc(d.name) + ' · ' + t('cur_level') + '</p><div class="slist">' + d.ex.map(srow).join('') + '</div>' : '';
    }).join('');
    var arch = PLAN.archive.filter(function (e) { return history(e.id).length; });
    if (arch.length) lists += '<p class="sect">' + t('removed') + '</p><div class="slist">' + arch.map(srow).join('') + '</div>';
    $view.innerHTML = top + '<p class="sect">' + t('exercises') + '</p>' + exCardProg() + lists;
  }

  /* ---------- обзор ---------- */
  function weekCard() {
    var cnt = {};
    sessionsSorted().forEach(function (x) { var w = weekStart(x.doc.date); cnt[w] = (cnt[w] || 0) + 1; });
    var tw = weekStart(todayStr()), c = cnt[tw] || 0, goal = PLAN.goal;
    var dots = '';
    for (var i = 0; i < Math.max(goal, c); i++) dots += '<span class="dot' + (i < c ? ' on' : '') + '"></span>';
    var streak = 0, w = tw;
    if (c >= goal) streak++;
    w = addDays(w, -7);
    while ((cnt[w] || 0) >= goal) { streak++; w = addDays(w, -7); }
    var txt = c >= goal ? t('week_done', { c: c, g: goal }) : t('week_left', { c: c, g: goal, d: esc(dayById(nextDay()).name) });
    return '<section class="card"><h2>' + t('this_week') + '</h2><div class="dots" aria-hidden="true">' + dots + '</div><p class="big">' + txt + '</p>' +
      '<p class="sub">' + t('streak', { n: streak }) + '</p></section>';
  }
  function calCard() {
    var byDate = {};
    sessionsSorted().forEach(function (x) { (byDate[x.doc.date] = byDate[x.doc.date] || []).push(x.doc.day); });
    var today = todayStr(), start = addDays(weekStart(today), -49);
    var html = '<span></span>' + wdNames().map(function (d) { return '<span class="ch">' + d + '</span>'; }).join('');
    for (var r = 0; r < 8; r++) {
      var ws = addDays(start, r * 7);
      html += '<span class="wl">' + shortDate(ws) + '</span>';
      for (var c = 0; c < 7; c++) {
        var d = addDays(ws, c), days = byDate[d], dd = String(+d.slice(8, 10));
        if (d > today) { html += '<span class="cell fut">' + dd + '</span>'; continue; }
        var label = longDate(d) + ', ' + (days ? days.map(function (x) { return dayById(x).name; }).join(' + ') : t('no_workout'));
        html += '<button type="button" class="cell' + (days ? ' on' : '') + (d === today ? ' today' : '') + '" data-cal="' + d + '" aria-label="' + esc(label) + '">' +
          (days ? days.map(dayTag).join('+') : dd) + '</button>';
      }
    }
    var legend = PLAN.days.map(function (d, i) { return t('day_tag', { n: i + 1 }) + ' — ' + esc(d.name); }).join(', ');
    return '<section class="card"><h2>' + t('calendar') + '</h2><p class="sub">' + t('cal_sub', { l: legend }) + '</p><div class="cal">' + html + '</div></section>';
  }
  function sessListCard() {
    var list = sessionsSorted().slice(-12).reverse();
    if (!list.length) return '';
    return '<section class="card"><h2>' + t('workouts_list') + '</h2><p class="sub">' + t('workouts_list_sub') + '</p><div class="hist">' + list.map(function (x) {
      var n = Object.keys(x.doc.entries).length, v = sessVolume(x.doc.entries);
      return '<div class="lrow"><button type="button" class="lopen" data-open="' + x.id + '"><strong>' + shortDate(x.doc.date) + '</strong> · ' + esc(dayById(x.doc.day).name) +
        '<span class="lm"> · ' + tn('n_ex', n) + (v ? ' · ' + nf(v) + ' ' + t('kg') : '') + '</span></button><span></span>' +
        '<button type="button" class="x" data-sxdel="' + x.id + '" aria-label="' + esc(t('del_workout_on', { d: longDate(x.doc.date) })) + '">×</button></div>';
    }).join('') + '</div></section>';
  }
  function volCard() {
    var all = sessionsSorted().map(function (x) { return { date: x.doc.date, day: x.doc.day, v: sessVolume(x.doc.entries) }; })
      .filter(function (x) { return x.v > 0; });
    var items = all.slice(-10);
    if (!items.length) return '<section class="card"><h2>' + t('vol_title') + '</h2><p class="empty">' + t('vol_empty') + '</p></section>';
    if (sel.vol == null || sel.vol >= items.length) sel.vol = items.length - 1;
    var s = items[sel.vol];
    function prevOf(it) {
      for (var i = all.indexOf(it) - 1; i >= 0; i--) if (all[i].day === it.day) return all[i];
      return null;
    }
    var p = prevOf(s);
    var cmp = p ? ' · ' + t('vol_vs_day', { p: pct(s.v, p.v) }) : '';
    var rows = items.slice().reverse().map(function (it) {
      var q = prevOf(it);
      return '<div class="lrow"><span>' + shortDate(it.date) + ' · ' + esc(dayById(it.day).name) + '</span><span class="lm">' + (q ? pct(it.v, q.v) : '') + '</span><span>' + nf(it.v) + ' ' + t('kg') + '</span></div>';
    }).join('');
    var bars = items.map(function (it) { return { v: it.v, l1: shortDate(it.date), l2: dayTag(it.day) }; });
    return '<section class="card"><h2>' + t('vol_title') + '</h2><p class="sub">' + t('vol_sub') + '</p>' +
      barChart(bars, sel.vol, 'vol', t('vol_title')) +
      '<p class="readout"><strong>' + longDate(s.date) + '</strong> · ' + esc(dayById(s.day).name) + ' · ' + nf(s.v) + ' ' + t('kg') + cmp + '</p>' +
      '<div class="hist">' + rows + '</div></section>';
  }
  function bodyCard() {
    var items = BODY.items;
    var last = lastBody(), due = Core.weighDue(items, todayStr());
    var form = '<form class="bform" id="bodyform"><input class="fi" id="bkg" type="text" inputmode="decimal" autocomplete="off" placeholder="' + (last ? fmt(last.kg) : t('kg')) + '" aria-label="' + esc(t('body_aria')) + '">' +
      '<input class="fi" id="bdate" type="date" value="' + todayStr() + '" max="' + todayStr() + '" aria-label="' + esc(t('body_date')) + '">' +
      '<button type="submit" class="btn">' + t('record') + '</button></form><p class="msg" id="bmsg"></p>';
    var status = due.days == null ? '' : due.due ? '<p class="note">' + tn('weigh_due', due.days) + '</p>' : '<p class="note ok">' + tn('weigh_next', 7 - due.days) + '</p>';
    var body = '';
    if (items.length) {
      if (sel.body == null || sel.body >= items.length) sel.body = items.length - 1;
      var f = items[0], d = r2(last.kg - f.kg), bmi = PREFS.height ? Core.bmi(PREFS.height, items[sel.body].kg) : null;
      body = lineChart(items.map(function (x) { return { date: x.date, v: x.kg }; }), 'body', sel.body, t('kg'), [0.5, 1, 2, 5, 10], t('body_title')) +
        '<p class="readout"><strong>' + longDate(items[sel.body].date) + '</strong> · ' + fmt(items[sel.body].kg) + ' ' + t('kg') + (bmi != null ? ' · ' + t('d_bmi') + ' ' + fmt(bmi) : '') +
        (items.length > 1 ? '<br>' + t('since_rec', { d: signed(d, t('kg')) }) : '') + '</p>' +
        '<div class="hist">' + items.slice().reverse().slice(0, 12).map(function (x) {
          return '<div class="lrow"><span>' + longDate(x.date) + '</span><span>' + fmt(x.kg) + ' ' + t('kg') + '</span><button type="button" class="x" data-bdel="' + x.date + '" aria-label="' + esc(t('del_rec', { d: longDate(x.date) })) + '">×</button></div>';
        }).join('') + '</div>';
    } else body = '<p class="empty">' + t('body_empty') + '</p>';
    return '<section class="card" id="bodycard"><h2>' + t('body_title') + '</h2>' + status + form + body + (PREFS.height ? '' : '<p class="sub">' + t('body_need_h') + '</p>') + '</section>';
  }
  function dataCard() {
    return '<section class="card"><h2>' + t('data') + '</h2>' +
      '<p class="sub">' + t('data_sub') + '</p>' +
      '<div class="btnrow"><button type="button" class="btn ghost small" data-cp="train">' + t('cp_train') + '</button>' +
      '<button type="button" class="btn ghost small" data-cp="body">' + t('cp_body') + '</button>' +
      '<button type="button" class="btn ghost small" data-cp="backup">' + t('cp_backup') + '</button></div>' +
      '<p class="msg info" id="dmsg"></p><textarea class="fi mono" id="copybox" rows="5" readonly hidden aria-label="' + esc(t('copy_aria')) + '"></textarea>' +
      '<h3>' + t('import_t') + '</h3><p class="sub">' + t('import_sub') + '</p>' +
