<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Дневник силовых тренировок для Telegram: веса и повторы, подсказка прогрессии, таймер отдыха, графики.">
<title>Дневник подходов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Раскладка: журнал на один экран. Сверху дни программы и дата, ниже карточки упражнений, снизу закреплённые таймер отдыха и навигация из четырёх разделов. */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --surface-2: #F3F5F7;
  --ink: #14181D;
  --muted: #5A6672;
  --line: #D8DDE3;
  --accent: #2545C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FB;
  --good: #12703F;
  --good-soft: #DDF1E6;
  --warn: #855600;
  --warn-soft: #F8EBCB;
  --font-display: 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1114; --surface: #161A1F; --surface-2: #1D2228; --ink: #E8ECF0; --muted: #9AA5B0;
    --line: #2B323A; --accent: #8CA2FF; --accent-ink: #0E1114; --accent-soft: #232B4A;
    --good: #5BD199; --good-soft: #173528; --warn: #E6B95C; --warn-soft: #3A2F14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1114; --surface: #161A1F; --surface-2: #1D2228; --ink: #E8ECF0; --muted: #9AA5B0;
  --line: #2B323A; --accent: #8CA2FF; --accent-ink: #0E1114; --accent-soft: #232B4A;
  --good: #5BD199; --good-soft: #173528; --warn: #E6B95C; --warn-soft: #3A2F14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.4 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 88px;
  -webkit-tap-highlight-color: transparent;
}
body.has-rest { padding-block-end: 150px; }
body.setup { padding-block-end: 32px; }
button, input, textarea, select { font-family: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, .datechip:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.app { max-width: 620px; margin-inline: auto; }

/* Шапка */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 22px/1.1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; margin: 0; }
#status { font-size: 12px; color: var(--muted); }
#status.err { color: var(--warn); }
.daybar { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; flex-wrap: wrap; flex: 1 1 220px; gap: 3px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.seg button { flex: 1 1 0; min-width: 64px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.datechip { position: relative; display: flex; align-items: center; min-height: 46px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; white-space: nowrap; }
.datechip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.note { margin: 0; padding: 8px 12px; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; }
.note.ok { color: var(--good); background: var(--good-soft); }

/* Общие блоки */
.ex, .card { margin-block-start: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.ex h2, .card h2 { margin: 0; font: 600 17px/1.25 var(--font-display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; min-width: 0; }
.card h3 { margin: 18px 0 2px; font-size: 14px; font-weight: 600; }
.card > summary { cursor: pointer; font-weight: 600; font-size: 14px; min-height: 28px; display: flex; align-items: center; }
.sub { margin: 2px 0 8px; font-size: 12.5px; color: var(--muted); }
.empty { margin: 10px 0 4px; color: var(--muted); font-size: 14px; }
.sect { margin: 20px 2px 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.foot { margin: 14px 2px 6px; font-size: 12.5px; color: var(--muted); }
.foot:empty { display: none; }
#vol { color: var(--ink); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.how { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--accent); }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 13px; }
.btn.wide { width: 100%; }
.msg { margin: 8px 0 0; font-size: 13px; color: var(--warn); }
.msg.info { color: var(--muted); }
.msg:empty { display: none; }
.fi { min-width: 0; min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: 500 16px var(--font-body); }
.fi:focus { border-color: var(--accent); outline: none; }
select.fi { padding: 0 8px; }
textarea.fi { display: block; width: 100%; min-height: 64px; padding: 10px 12px; font: 400 16px/1.35 var(--font-body); resize: vertical; }
textarea.mono { font: 400 13px/1.35 ui-monospace, Menlo, Consolas, monospace; margin-top: 8px; }

/* Первый запуск */
.hero h2 { font-size: 22px; }
.hero p { margin: 6px 0 0; font-size: 14.5px; }
.tpls { display: grid; gap: 8px; }
.tpl { display: grid; gap: 4px; width: 100%; padding: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); cursor: pointer; }
.tpl:hover { border-color: var(--accent); }
.tpl strong { font: 600 17px/1.2 var(--font-display); letter-spacing: .03em; text-transform: uppercase; }
.tpl .meta { font-size: 12px; font-weight: 600; color: var(--accent); }
.tpl span:last-child { font-size: 13px; color: var(--muted); }

/* Ход тренировки */
.live { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.live .lt { font-size: 13px; color: var(--muted); }
.live .lv { display: block; font: 600 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.startrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.startrow .sub { margin: 0; flex: 1 1 180px; }
.sum h2 { color: var(--good); }
.sumlist { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }

/* Карточка упражнения */
.ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.pill { padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill:empty { display: none; }
.pill.pr { background: var(--accent-soft); color: var(--accent); }
.pill.up { background: var(--good-soft); color: var(--good); }
.pill.flat { background: var(--surface-2); color: var(--muted); }
.pill.down { background: var(--warn-soft); color: var(--warn); }
.swapnote { margin: 4px 0 0; font-size: 12.5px; color: var(--accent); }
.prev { margin: 6px 0 10px; font-size: 13px; color: var(--muted); }
.sugg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.sugg.up { background: var(--good-soft); }
.sugg.deload { background: var(--warn-soft); }
.sugg .tag { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sugg.up .tag { color: var(--good); }
.sugg.deload .tag { color: var(--warn); }
.sugg .sv { font: 600 19px var(--font-display); font-variant-numeric: tabular-nums; }
.sugg .sw { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.sugg .pl { flex-basis: 100%; font-size: 12.5px; color: var(--ink); }
.sets { display: grid; gap: 6px; }
.row, .sethead { display: grid; grid-template-columns: 78px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.sethead { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sethead span:not(:first-child) { text-align: center; }
.lbl { font-size: 13px; font-weight: 600; }
.row.warm .lbl { font-weight: 500; color: var(--muted); }
input.n { width: 100%; min-height: 46px; padding: 0 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: 500 20px var(--font-display); text-align: center; font-variant-numeric: tabular-nums; }
input.n::placeholder { color: var(--muted); opacity: .55; }
.row.warm input.n { background: transparent; border-style: dashed; font-size: 17px; }
input.n:focus { border-color: var(--accent); outline: none; }
.stepbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 0 4px 86px; }
.stepbar button { min-width: 64px; min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: 600 16px var(--font-display); font-variant-numeric: tabular-nums; cursor: pointer; touch-action: manipulation; }
.stepbar button.fill { border-color: var(--accent); color: var(--accent); font: 600 13px var(--font-body); }
.stepbar .pl { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.feel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.feel .fl { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
.feel button { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink); font-size: 13px; cursor: pointer; }
.feel button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.swap { display: grid; gap: 8px; margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--surface-2); }
.swap .fi { width: 100%; background: var(--surface); }
details.nb { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
details.nb summary { display: flex; align-items: center; min-height: 34px; font-size: 13px; color: var(--muted); cursor: pointer; }
details.nb[open] summary { margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.inl { display: inline-flex; vertical-align: middle; }
.c { padding: 3px 8px; border-radius: 8px; background: var(--surface-2); font: 500 15px var(--font-display); font-variant-numeric: tabular-nums; }
.c.w { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.c.f { background: transparent; font: 500 12.5px var(--font-body); color: var(--muted); align-self: center; }

/* Таймер отдыха */
.rest { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 9; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--accent-soft); border-top: 1px solid var(--line); }
.rest.done { background: var(--good-soft); }
.rest-main { display: flex; align-items: baseline; gap: 10px; }
.rl { font-size: 13px; font-weight: 600; color: var(--muted); }
.rest.done .rl { color: var(--good); }
.rt { font: 600 28px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.rest-btns { display: flex; gap: 6px; }
.rest-btns button { min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }

/* Нижняя навигация */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 4px; height: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 48px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Графики */
svg.chart { display: block; width: 100%; height: auto; margin-top: 6px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font: 11px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .area { fill: var(--accent); fill-opacity: .12; stroke: none; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .bar { fill: var(--accent); }
.chart .bar.dim { fill-opacity: .45; }
.chart .vlbl { fill: var(--ink); font: 600 13px var(--font-display); }
.chart .hit { fill: transparent; cursor: pointer; }
.readout { margin: 8px 0 0; min-height: 2.8em; font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0 4px; }
.stats div { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); }
.stats dd { margin: 2px 0 0; font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.hist { margin-top: 10px; }
.hrow { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.hd { font: 500 16px var(--font-display); }
.slist { display: grid; gap: 6px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); font-size: 14px; cursor: pointer; }
.srow[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sname { font-weight: 500; min-width: 0; }
.sright { text-align: right; }
.sval { font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.sd { display: block; font-size: 12px; color: var(--muted); }
.sd.up { color: var(--good); }

/* Обзор */
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
.dot { width: 34px; height: 8px; border-radius: 4px; background: var(--line); }
.dot.on { background: var(--accent); }
.big { margin: 0; font-size: 14.5px; }
.cal { display: grid; grid-template-columns: 42px repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.cal .ch { font-size: 11px; color: var(--muted); text-align: center; }
.cal .wl { align-self: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell { display: flex; align-items: center; justify-content: center; height: 36px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); color: var(--muted); font: 500 12px var(--font-body); font-variant-numeric: tabular-nums; cursor: pointer; overflow: hidden; }
.cell.on { background: var(--accent); color: var(--accent-ink); font: 600 13px var(--font-display); }
.cell.today { border-color: var(--accent); }
.cell.fut { background: transparent; opacity: .45; cursor: default; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 44px; padding: 4px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.lrow .lm { color: var(--muted); font-size: 12.5px; }
.x { min-width: 36px; height: 36px; padding: 0 6px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 18px; cursor: pointer; white-space: nowrap; }
.x.armed { font-size: 13px; font-weight: 600; color: var(--warn); background: var(--warn-soft); }
.bform { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.bform .fi { flex: 1 1 110px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.srec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); }
.srec button.open { display: grid; gap: 2px; padding: 10px 0; border: 0; background: none; color: var(--ink); text-align: left; font-size: 14px; cursor: pointer; min-width: 0; }
.srec .sm { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grows { display: grid; gap: 10px; margin-top: 10px; }
.grow { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
.gtrack { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.gtrack span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.gtrack i { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--muted); opacity: .5; }
.gval { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.gval small { color: var(--muted); font-size: 12px; }

/* План */
.dayhead { display: flex; gap: 8px; align-items: center; margin: 22px 0 4px; }
.dayhead .fi { flex: 1 1 auto; font: 600 16px var(--font-body); }
.pe { display: grid; gap: 10px; margin-top: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pname { width: 100%; font-weight: 600; }
.psel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.psel label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); min-width: 0; }
.psel .fi { width: 100%; min-height: 42px; font-size: 14px; }
.pgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pgrid label { display: grid; gap: 4px; align-content: end; font-size: 11px; line-height: 1.2; color: var(--muted); min-width: 0; }
.pgrid .fi { width: 100%; min-height: 42px; padding: 0 2px; text-align: center; font: 500 17px var(--font-display); }
.prow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.chks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.chk { display: flex; align-items: center; gap: 8px; min-height: 38px; font-size: 13.5px; cursor: pointer; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.pbtns { display: flex; gap: 6px; }
.ib { min-width: 40px; min-height: 38px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--ink); font-size: 15px; cursor: pointer; white-space: nowrap; }
.ib:disabled { opacity: .35; cursor: default; }
.ib.danger { color: var(--warn); font-size: 13px; font-weight: 600; }
.ib.danger.armed { background: var(--warn-soft); }
.btn.danger { background: none; border: 1px solid var(--warn); color: var(--warn); }
.btn.danger.armed { background: var(--warn-soft); }
.reset .chk { margin: 10px 0 2px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; font-size: 13.5px; }
.field .fi { width: 76px; text-align: center; }
.field .fi.wide { width: 170px; }
@media (max-width: 380px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grow { grid-template-columns: 92px minmax(0, 1fr) auto; } }

@media (prefers-reduced-motion: no-preference) {
  .seg button, .srow, .feel button, .cell, .tpl { transition: background-color .15s, border-color .15s; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Дневник подходов</h1>
      <span id="status" role="status" aria-live="polite">Загружаю…</span>
    </div>
    <div class="daybar" id="daybar">
      <div class="seg" id="seg" role="group" aria-label="День программы"></div>

  var draft = {};
  var meta = { t0: null, t1: null, x: {} };
  var cur = { day: 1, date: todayStr() };
  var tab = 'log';
  var setup = false, choosing = false;
  var selEx = null;
  var sel = { ex: null, body: null, vol: null };
  var histN = 10;
  var swapOpen = null;
  var mode = 'pending';
  var dirty = false, userChose = false;
  var pend = { sess: false, plan: false, body: false };
  var timers = {};
  var noteDirty = {}, bodyYears = {}, storedDays = {};
  var chain = Promise.resolve();
  var armed = null;

  var $view = document.getElementById('view');
  var $status = document.getElementById('status');
  var $note = document.getElementById('note');
  var $datein = document.getElementById('datein');
  var $seg = document.getElementById('seg');

  /* ---------- утилиты ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function dt(s) { return new Date(s + 'T12:00:00'); }
  function addDays(s, n) { var d = dt(s); d.setDate(d.getDate() + n); return ymd(d); }
  function weekStart(s) { var d = dt(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }
  function curId() { return cur.date + '_d' + cur.day; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function roundTo(x, s) { return r2(Math.round(x / s) * s); }
  function fmt(n) { return n == null ? '' : String(r2(n)).replace('.', ','); }
  function nf(n) { return Math.round(n).toLocaleString('ru-RU'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function parseNum(s) { var v = parseFloat(String(s).replace(',', '.')); return isFinite(v) && v >= 0 ? v : null; }
  function shortDate(s) { return s.slice(8, 10) + '.' + s.slice(5, 7); }
  function longDate(s) { return dt(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); }
  function chipDate(s) { return dt(s).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' }); }
  function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function plural(n, a, b, c) { var m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); }
  function durText(ms) { var m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? m + ' мин' : Math.floor(m / 60) + ' ч ' + pad(m % 60) + ' мин'; }
  function clock(ms) { var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); }
  function cell0() { return { kg: null, reps: null }; }
  function blank(n) { var s = []; for (var i = 0; i < (n || 3); i++) s.push(cell0()); return { w: cell0(), s: s, feel: null }; }
  function ensure(e, n) { while (e.s.length < n) e.s.push(cell0()); return e; }
  function nn(v) { if (v == null || v === '') return null; v = +v; return isFinite(v) && v >= 0 ? v : null; }
  function norm(e) {
    var b = { w: cell0(), s: [], feel: null };
    if (!e) return b;
    function cp(src) { return { kg: src ? nn(src.kg) : null, reps: src ? nn(src.reps) : null }; }
    b.w = cp(e.w);
    b.s = (Array.isArray(e.s) ? e.s.slice(0, MAXSETS) : []).map(cp);
    b.feel = (e.feel === 1 || e.feel === 2 || e.feel === 3) ? e.feel : null;
    return b;
  }
  function filled(c) { return !!c && (c.kg != null || c.reps != null); }
  function lastFilled(e) { for (var i = e.s.length - 1; i >= 0; i--) if (filled(e.s[i])) return i; return -1; }
  function setsOf(entry) { return norm(entry).s.filter(filled); }
  function exType(id) { return BYID[id] ? BYID[id].type : 'w'; }
  function entryCount(doc) { return doc && doc.entries ? Object.keys(doc.entries).length : 0; }

  /* показатели упражнения разных типов */
  function topKg(e) { var m = null; norm(e).s.forEach(function (c) { if (c.kg != null && (m == null || c.kg > m)) m = c.kg; }); return m; }
  function e1(c) { if (c.kg == null || c.reps == null || c.reps < 1) return null; return c.reps === 1 ? c.kg : c.kg * (1 + c.reps / 30); }
  function metricMode(ex) {
    if (!ex || ex.type === 'w') return 'kg';
    if (ex.type === 'time') return 'sec';
    var h = history(ex.id);
    if (ex.type === 'cardio') return h.some(function (p) { return setsOf(p.entry).some(function (c) { return c.kg; }); }) ? 'km' : 'min';
    return h.some(function (p) { return setsOf(p.entry).some(function (c) { return c.kg > 0; }); }) ? 'kg' : 'reps';
  }
  function value(entry, mode, ex) {
    var s = setsOf(entry), v = null;
    if (mode === 'km' || mode === 'min') {
      var sum = 0, any = false;
      s.forEach(function (c) { var x = mode === 'km' ? c.kg : c.reps; if (x != null) { sum += x; any = true; } });
      return any ? r2(sum) : null;
    }
    s.forEach(function (c) {
      var x;
      if (mode === 'kg') x = c.kg != null ? c.kg : (ex && ex.type === 'bw' && c.reps != null ? 0 : null);
      else x = c.reps;
      if (x != null && (v == null || x > v)) v = x;
    });
    return v;
  }
  function valText(v, mode, ex) {
    if (v == null) return '–';
    if (mode === 'kg' && ex && ex.type === 'bw') return v > 0 ? '+' + fmt(v) + ' кг' : 'свой вес';
    return fmt(v) + ' ' + UNIT[mode];
  }
  function cellText(c, ex) {
    if (!c || !filled(c)) return '';
    var t = ex ? ex.type : 'w';
    if (t === 'cardio') return [c.kg != null ? fmt(c.kg) + ' км' : '', c.reps != null ? fmt(c.reps) + ' мин' : ''].filter(Boolean).join(' · ');
    if (t === 'time') return (c.kg ? '+' + fmt(c.kg) + ' кг · ' : '') + (c.reps == null ? '?' : fmt(c.reps)) + ' с';
    if (t === 'bw') return (c.kg ? '+' + fmt(c.kg) + '×' : '') + (c.reps == null ? '?' : fmt(c.reps));
    return (c.kg == null ? '?' : fmt(c.kg)) + '×' + (c.reps == null ? '?' : fmt(c.reps));
  }
  function chipsHtml(e, ex, withFeel) {
    e = norm(e);
    var out = '';
    if (filled(e.w)) out += '<span class="c w" title="Разминка">р ' + cellText(e.w, ex) + '</span>';
    e.s.forEach(function (c) { if (filled(c)) out += '<span class="c">' + cellText(c, ex) + '</span>'; });
    if (withFeel && e.feel) out += '<span class="c f">' + FEEL[e.feel].toLowerCase() + '</span>';
    return out;
  }
  function platesText(total) {
    if (total == null) return '';
    var bar = PLAN.barKg;
    if (total < bar) return 'Меньше веса грифа (' + fmt(bar) + ' кг).';
    var side = r2((total - bar) / 2);
    if (side === 0) return 'Только гриф.';
    var out = [], rest = side;
    PLAN.plates.forEach(function (p) { while (rest >= p - 1e-9) { out.push(p); rest = r2(rest - p); } });
    return 'На каждую сторону: ' + (out.length ? out.map(fmt).join(' + ') : '—') + (rest > 0.001 ? ' (не хватает ' + fmt(rest) + ' кг)' : '') + '.';
  }

  /* ---------- компактная запись тренировки ---------- */
  function enc(doc) {
    var e = {};
    Object.keys(doc.entries).forEach(function (k) {
      var x = doc.entries[k], a = [x.feel, x.w.kg, x.w.reps];
      x.s.forEach(function (c) { a.push(c.kg, c.reps); });
      e[k] = a;
    });
    var o = { v: 2, d: doc.date, y: doc.day, e: e };
    if (doc.t0) o.a = doc.t0;
    if (doc.t1) o.b = doc.t1;
    if (doc.x && Object.keys(doc.x).length) o.x = doc.x;
    return JSON.stringify(o);
  }
  function cleanX(x) {
    var out = {};
    if (x && typeof x === 'object') Object.keys(x).forEach(function (k) { var a = String(k).replace(/[^A-Za-z0-9_-]/g, ''), b = String(x[k]).replace(/[^A-Za-z0-9_-]/g, ''); if (a && b) out[a] = b; });
    return out;
  }
  function dec(str) {
    var o = JSON.parse(str), entries = {};
    Object.keys(o.e || {}).forEach(function (k) {
      var a = o.e[k] || [], s = [];
      if (o.v === 2) {
        for (var i = 3; i < a.length && i < 3 + MAXSETS * 2; i += 2) s.push({ kg: a[i], reps: a[i + 1] });
        entries[k] = norm({ w: { kg: a[1], reps: a[2] }, s: s, feel: a[0] });
      } else {
        entries[k] = norm({ w: { kg: a[0], reps: a[1] }, s: [{ kg: a[2], reps: a[3] }, { kg: a[4], reps: a[5] }, { kg: a[6], reps: a[7] }], feel: a[8] });
      }
    });
    return { date: o.d, day: Math.round(+o.y) || 1, entries: entries, t0: +o.a || null, t1: +o.b || null, x: cleanX(o.x) };
  }

  /* ---------- история ---------- */
  function sessionsSorted() {
    return Object.keys(S).map(function (id) { return { id: id, doc: S[id] }; })
      .filter(function (x) { return x.doc && x.doc.date && entryCount(x.doc); })
      .sort(function (a, b) { return a.doc.date < b.doc.date ? -1 : a.doc.date > b.doc.date ? 1 : (a.id < b.id ? -1 : 1); });
  }
  function history(exId) {
    var out = [];
    sessionsSorted().forEach(function (x) {
      var e = x.doc.entries[exId];
      if (!e || !setsOf(e).length) return;
      out.push({ id: x.id, date: x.doc.date, entry: norm(e), kg: topKg(e) });
    });
    return out;
  }
  function prevList(exId) { return history(exId).filter(function (p) { return p.id !== curId() && p.date <= cur.date; }); }
  function prevEntry(exId) { var h = prevList(exId); return h.length ? h[h.length - 1] : null; }
  function records(ex, excludeId, maxDate, mode) {
    var b = { best: null, e1: null, n: 0 };
    history(ex.id).forEach(function (p) {
      if (p.id === excludeId || (maxDate && p.date > maxDate)) return;
      b.n++;
      var v = value(p.entry, mode, ex);
      if (v != null && (b.best == null || v > b.best)) b.best = v;
      if (ex.type === 'w') p.entry.s.forEach(function (c) { var x = e1(c); if (x != null && (b.e1 == null || x > b.e1)) b.e1 = x; });
    });
    return b;
  }
  function sessVolume(entries) {
    var v = 0;
    Object.keys(entries || {}).forEach(function (k) {
      var ex = BYID[k];
      if (ex && ex.type !== 'w') return;
      var m = ex && ex.dumbbell ? 2 : 1;
      norm(entries[k]).s.forEach(function (c) { if (c.kg != null && c.reps != null) v += c.kg * c.reps * m; });
    });
    return Math.round(v);
  }
  function setCount(entries) { var n = 0; Object.keys(entries || {}).forEach(function (k) { n += setsOf(entries[k]).length; }); return n; }
  function prevSameDay() {
    var l = sessionsSorted().filter(function (x) { return x.doc.day === cur.day && x.id !== curId() && x.doc.date <= cur.date; });
    return l.length ? l[l.length - 1] : null;
  }
  function nextDay() {
    var l = sessionsSorted();
    if (!l.length) return PLAN.days[0].id;
    var i = dayIndex(l[l.length - 1].doc.day);
    return PLAN.days[(i + 1) % PLAN.days.length].id;
  }

  /* ---------- подсказка прогрессии и разгрузка ---------- */
  function setInfo(entry, ex) {
    var sets = norm(entry).s.filter(function (c) { return ex.type === 'bw' ? c.reps != null || c.kg != null : c.kg != null; });
    if (!sets.length) return null;
    function kv(c) { return c.kg == null ? 0 : c.kg; }
    var W = Math.max.apply(null, sets.map(kv));
    var atW = sets.filter(function (c) { return kv(c) === W; });
    var minR = Math.min.apply(null, atW.map(function (c) { return c.reps == null ? 0 : c.reps; }));
    return { W: W, minR: minR, full: atW.length >= ex.sets && minR >= ex.hi };
  }
  function suggest(ex, list) {
    if (!TYPES[ex.type].sugg) return null;
    var range = ex.lo + '–' + ex.hi, prev = list.length ? list[list.length - 1] : null;
    if (!prev) {
      return ex.start ? { kind: 'start', tag: 'Стартовый вес', kg: ex.start, reps: ex.lo, why: 'Цель: ' + ex.sets + ' ' + plural(ex.sets, 'подход', 'подхода', 'подходов') + ' по ' + range + ' повторов.' } : null;
    }
    var info = setInfo(prev.entry, ex);
    if (!info) return null;
    var W = info.W;
    if (info.full && prev.entry.feel !== 3) {
      return { kind: 'up', tag: 'Повысьте вес', kg: r2(W + ex.step), reps: ex.lo, why: 'В прошлый раз во всех рабочих подходах ' + ex.hi + ' повторов и больше, это верх диапазона ' + range + '.' };
    }
    if (info.full) return { kind: 'hold', tag: 'Тот же вес', kg: W, reps: ex.hi, why: 'Повторы набраны, но вы отметили «на пределе». Закрепите этот вес ещё раз.' };
    var earlier = list.slice(-5, -1).map(function (p) { return setInfo(p.entry, ex); }).filter(Boolean);
    var recentMax = earlier.reduce(function (m, i) { return Math.max(m, i.W); }, 0);
    if (recentMax > W && earlier.length && setInfo(list[list.length - 2] ? list[list.length - 2].entry : null, ex) && earlier[earlier.length - 1].W > W) {
      return { kind: 'up', tag: 'Возвращайтесь', kg: recentMax, reps: ex.lo, why: 'После облегчённой тренировки вернитесь к рабочему весу ' + fmt(recentMax) + ' кг.' };
    }
    if (W > 0 && list.length >= 3) {
      var last3 = list.slice(-3).map(function (p) { return setInfo(p.entry, ex); });
      if (last3.every(function (i) { return i && i.W === W && !i.full; })) {
        var dl = roundTo(W * 0.9, ex.step);
        if (dl < W) return { kind: 'deload', tag: 'Разгрузка', kg: dl, reps: ex.hi, why: 'Вес ' + fmt(W) + ' кг держится три тренировки подряд. Сделайте одну тренировку с ' + fmt(dl) + ' кг на верх диапазона, а в следующий раз вернитесь к ' + fmt(W) + ' кг.' };
      }
    }
    if (info.minR < ex.lo) return { kind: 'hold', tag: 'Тот же вес', kg: W, reps: ex.lo, why: 'Цель: хотя бы ' + ex.lo + ' повторов в каждом подходе.' };
    return { kind: 'hold', tag: 'Тот же вес', kg: W, reps: Math.min(ex.hi, info.minR + 1), why: 'Добавляйте по повтору. Когда во всех подходах будет ' + ex.hi + ', вес вырастет на ' + fmt(ex.step) + ' кг.' };
  }
  function sgText(sg, ex) {
    if (ex.type === 'bw') return (sg.kg > 0 ? '+' + fmt(sg.kg) + ' кг' : 'Свой вес') + ' × ' + sg.reps;
    return fmt(sg.kg) + ' кг × ' + sg.reps;
  }

  /* ---------- черновик текущей тренировки ---------- */
  function loadDraft() {
    var doc = S[curId()];
    draft = {};
    meta = { t0: null, t1: null, x: {} };
    if (doc) {
      if (doc.entries) Object.keys(doc.entries).forEach(function (k) { draft[k] = norm(doc.entries[k]); });
      meta = { t0: doc.t0 || null, t1: doc.t1 || null, x: cleanX(doc.x) };
    }
    swapOpen = null;
    dirty = false;
  }
  function buildDoc() {
    var entries = {}, any = false;
    Object.keys(draft).forEach(function (k) {
      var e = draft[k], lf = lastFilled(e);
      if (filled(e.w) || lf >= 0) {
        entries[k] = { w: e.w, s: e.s.slice(0, lf + 1), feel: e.feel };
        any = true;
      }
    });
    var hasMeta = meta.t0 || Object.keys(meta.x).length;
    if (!any && !hasMeta) return null;
    var doc = { date: cur.date, day: cur.day, entries: entries };
    if (meta.t0) doc.t0 = meta.t0;
    if (meta.t1) doc.t1 = meta.t1;
    if (Object.keys(meta.x).length) doc.x = meta.x;
    return doc;
  }

  /* ---------- сохранение ---------- */
  function anyPending() { return pend.sess || pend.plan || pend.body; }
  function setStatus(kind, text) {
    $status.className = '';
    if (kind === 'connecting') $status.textContent = 'Загружаю…';
    else if (kind === 'saving') $status.textContent = 'Сохраняю…';
    else if (kind === 'error') { $status.textContent = text || 'Не удалось сохранить'; $status.className = 'err'; }
    else if (mode === 'tg' && queued()) { $status.textContent = 'Сохранено на телефоне'; $status.className = 'err'; }
    else $status.textContent = mode === 'tg' ? 'Сохранено' : mode === 'local' ? 'Сохранено в браузере' : mode === 'memory' ? 'Не сохраняется' : 'Загружаю…';
  }
  function syncState() {
    if (anyPending()) return;
    setStatus('saved');
    showNote();
    closingGuard(mode === 'tg' && queued() > 0);
  }
  function scheduleSave(kind) {
    pend[kind] = true;
    setStatus('saving');
    closingGuard(true);
    clearTimeout(timers[kind]);
    timers[kind] = setTimeout(function () { flush(kind); }, 700);
  }
  function planJob() {
    var cfg = JSON.stringify({
      v: 2, autoTimer: PLAN.autoTimer, goal: PLAN.goal, oldDays: PLAN.oldDays, barKg: PLAN.barKg, plates: PLAN.plates,
      order: PLAN.days.map(function (d) { return { id: d.id, name: d.name }; }),
      archive: PLAN.archive.map(function (e) { return strip(e, false); })
    });
    var days = PLAN.days.map(function (d) { return ['cfg_day' + d.id, JSON.stringify({ ex: d.ex.map(function (e) { return strip(e, false); }) })]; });
    var now = {};
    PLAN.days.forEach(function (d) { now[d.id] = 1; });
    var dels = Object.keys(storedDays).filter(function (id) { return !now[id]; }).map(function (id) { return 'cfg_day' + id; });
    storedDays = now;
    var notes = noteDirty; noteDirty = {};
    return function () {
      var pr = kvPut('cfg_plan', cfg);
      days.forEach(function (d) { pr = pr.then(function () { return kvPut(d[0], d[1]); }); });
      dels.forEach(function (k) { pr = pr.then(function () { return kvPut(k, null); }); });
      Object.keys(notes).forEach(function (id) { pr = pr.then(function () { return kvPut('n_' + id, notes[id] || null); }); });
      return pr;
    };
  }
  function bodyJob() {
    var ys = bodyYears; bodyYears = {};
    var parts = {};
    Object.keys(ys).forEach(function (y) {
      parts[y] = BODY.items.filter(function (x) { return x.date.slice(0, 4) === y; }).map(function (x) { return [x.date, x.kg]; });
    });
    return function () {
      return Object.keys(parts).reduce(function (pr, y) {
        return pr.then(function () { return kvPut('b_' + y, parts[y].length ? JSON.stringify(parts[y]) : null); });
      }, Promise.resolve());
    };
  }
  function runJob(job) {
    chain = chain.then(job)
      .then(function () { syncState(); })
      .catch(function (err) {
        console.error(err);
        setStatus('error', err && err.tooBig ? 'Слишком большая запись, не сохранено' : 'Не удалось сохранить');
      });
  }
  function flush(kind) {
    clearTimeout(timers[kind]);
    timers[kind] = null;
    if (!pend[kind]) return;
    if (mode === 'pending') { timers[kind] = setTimeout(function () { flush(kind); }, 800); return; }
    if (mode === 'failed') return;
    pend[kind] = false;
    var job;
    if (kind === 'sess') {
      var id = curId(), doc = buildDoc();
      if (doc) S[id] = doc; else delete S[id];
      job = function () { return kvPut('s_' + id, doc ? enc(doc) : null); };
    } else if (kind === 'plan') job = planJob();
    else job = bodyJob();
    runJob(job);
  }
  function flushAll() { ['sess', 'plan', 'body'].forEach(flush); }
  var noteT = null, noteOk = '';
  function showNote(okText) {
    var t = '', ok = false;
    if (okText) { noteOk = okText; clearTimeout(noteT); noteT = setTimeout(function () { noteOk = ''; showNote(); }, 6000); }
    if (noteOk) { t = noteOk; ok = true; }
    else if (mode === 'failed') t = 'Не удалось загрузить данные из Телеграма. Проверьте интернет, закройте приложение и откройте снова.';
    else if (mode === 'tg' && (offline || queued())) t = 'Нет связи. Записи сохраняются на телефоне и отправятся в облако Телеграма, когда появится интернет.';
    else if (mode === 'memory') t = 'Браузер блокирует хранилище, записи пропадут после закрытия страницы.';
    else if (mode === 'local' && inTg) t = 'Эта версия Телеграма не умеет хранить данные в облаке, записи лежат только на этом устройстве. Обновите Телеграм.';
    else if (mode === 'local') t = 'Страница открыта не в Телеграме, поэтому записи хранятся только в этом браузере.';
    $note.textContent = t;
    $note.className = 'note' + (ok ? ' ok' : '');
    $note.hidden = !t;
  }

  /* ---------- загрузка ---------- */
  function parseValues(v) {
    var next = {}, cfg = null, rawDays = {}, notes = {}, body = [];
    Object.keys(v).forEach(function (k) {
      var s = v[k];
      if (s == null || s === '') return;
      try {
        if (k.indexOf('s_') === 0) { var d = dec(s); if (isDate(d.date)) next[k.slice(2)] = d; }
        else if (k === 'cfg_plan') cfg = JSON.parse(s);
        else if (/^cfg_day\d+$/.test(k)) rawDays[+k.slice(7)] = JSON.parse(s);

  function applyTemplate(k) {
    var t = TEMPLATES.filter(function (x) { return x.k === k; })[0];
    if (!t) return;
    var raw = t.plan(), notes = {};
    Object.keys(BYID).forEach(function (id) { if (BYID[id].note) notes[id] = BYID[id].note; });
    raw.barKg = PLAN.barKg; raw.plates = PLAN.plates;
    if (Object.keys(S).length || !setup) {
      var base = maxDayId(), newIds = {}, arch = PLAN.archive.slice(), od = {};
      Object.keys(PLAN.oldDays).forEach(function (x) { od[x] = PLAN.oldDays[x]; });
      raw.days.forEach(function (d, i) { d.id = base + i + 1; d.ex.forEach(function (e) { newIds[e.id] = 1; }); });
      PLAN.days.forEach(function (d) {
        od[d.id] = d.name;
        d.ex.forEach(function (e) {
          if (newIds[e.id]) return;
          if (history(e.id).length) arch.push(e); else noteDirty[e.id] = '';
        });
      });
      raw.archive = arch.filter(function (e) { return !newIds[e.id]; });
      raw.oldDays = od;
      raw.autoTimer = PLAN.autoTimer;
    }
    PLAN = cleanPlan(raw);
    reindex();
    Object.keys(notes).forEach(function (id) { if (BYID[id]) BYID[id].note = notes[id]; });
    setup = false; choosing = false;
    cur.day = PLAN.days[0].id;

  /* ---------- тренировка: начало и итог ---------- */
  function isToday() { return cur.date === todayStr(); }
  function prFor(id) {
    var ex = BYID[id], e = draft[id];
    if (!ex || !e || !setsOf(e).length) return '';
    var mode = metricMode(ex), b = records(ex, curId(), cur.date, mode);
    if (!b.n) return '';
    var v = value(e, mode, ex);
    if (v != null && b.best != null && v > b.best) return ex.type === 'w' ? 'Рекорд веса' : 'Рекорд';
    if (ex.type === 'w' && b.e1 != null) {
      var m = null;
      e.s.forEach(function (c) { var x = e1(c); if (x != null && (m == null || x > m)) m = x; });
      if (m != null && m > b.e1 + 0.05) return 'Рекорд 1ПМ';
    }
    return '';
  }
  function summaryData() {
    var vol = sessVolume(draft), p = prevSameDay(), pv = p ? sessVolume(p.doc.entries) : 0;
    var prs = [];
    Object.keys(draft).forEach(function (id) {
      var t = prFor(id);
      if (t) { var ex = BYID[id], mode = metricMode(ex); prs.push({ name: ex.name, val: valText(value(draft[id], mode, ex), mode, ex) }); }
    });
    return {
      dur: meta.t0 && meta.t1 ? meta.t1 - meta.t0 : null, sets: setCount(draft), ex: Object.keys(draft).filter(function (k) { return setsOf(draft[k]).length; }).length,
      vol: vol, dv: pv ? Math.round((vol - pv) / pv * 100) : null, prs: prs
    };
  }
  function signed(d) { return (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d); }
  function shareText() {
    var s = summaryData();
    var lines = ['Тренировка «' + dayById(cur.day).name + '», ' + longDate(cur.date)];
    var l2 = [];

    if (s.vol) l2.push('объём ' + nf(s.vol) + ' кг' + (s.dv != null ? ' (' + signed(s.dv) + '%)' : ''));
    lines.push(l2.join(' · '));

  function sessHead() {

  /* ---------- тренировка: карточки ---------- */
  function rowHtml(ex, slot, label, warm, cell, phKg, phReps, last) {
    var done = filled(cell) && (ex.type === 'w' ? cell.kg != null && cell.reps != null : cell.reps != null || cell.kg != null);
    var ty = TYPES[ex.type];
    function inp(f, val, ph, im) {
      var lab = label + ', ' + (f === 'kg' ? ty.c1 + (ex.dumbbell && ex.type === 'w' ? ' на гантель' : '') : ty.c2);
      return '<input class="n" id="i_' + ex.id + '_' + slot + '_' + f + '" data-ex="' + ex.id + '" data-slot="' + slot + '" data-f="' + f + '" type="text" inputmode="' + im + '" autocomplete="off" enterkeyhint="next" aria-label="' + esc(lab) + '" placeholder="' + (ph == null ? '–' : fmt(ph)) + '" value="' + fmt(val) + '">';
    }
    return '<div class="row' + (warm ? ' warm' : '') + '" data-done="' + (done ? '1' : '') + '"' + (last ? ' data-last="1"' : '') + '><span class="lbl">' + label + '</span>' +
      inp('kg', cell.kg, phKg, 'decimal') + inp('reps', cell.reps, phReps, ex.type === 'cardio' ? 'decimal' : 'numeric') + '</div>';
  }
  function rowsFor(ex, e) { return Math.min(MAXSETS, Math.max(ex.sets, lastFilled(e) + 1)); }
  function logItems() {
    var day = dayById(cur.day), list = [], have = {};
    day.ex.forEach(function (e) {
      var r = meta.x[e.id] && BYID[meta.x[e.id]];
      var ex = r || e;
      if (have[ex.id]) return;
      have[ex.id] = 1;
      list.push({ ex: ex, orig: r ? e : null, planned: true });
    });
    Object.keys(draft).forEach(function (k) { if (!have[k] && BYID[k]) { list.push({ ex: BYID[k], orig: null, planned: false }); have[k] = 1; } });
    return list;
  }
  function swapPanel(key, items) {

  function exCard(it, items) {

    var sg = suggest(ex, list);

    ensure(e, n);
    var prevLine = prev
      ? 'Прошлый раз, ' + shortDate(prev.date) + ': <span class="chips inl">' + chipsHtml(prev.entry, ex, true) + '</span>'

  }
  function renderLog() {

    if (t !== 'cardio') fields += f('rest', 'Отдых, сек', ex.rest, 'numeric');

  function renderPlan() {

      '<li>Подсказка веса: когда во всех рабочих подходах набран верх диапазона повторов, вес растёт на шаг. Если вес стоит три тренировки подряд, подсказка предложит разгрузку.</li>' +
      '<li>Таймер отдыха запускается сам, когда подход заполнен. После последнего подхода не запускается.</li>' +

      '<div class="field"><label for="set_plates">Блины в зале, кг (через пробел)</label><input class="fi wide" id="set_plates" type="text" inputmode="decimal" value="' + PLAN.plates.map(fmt).join(' ') + '"></div>' +
      '<p class="sub">Изменения сохраняются сами.</p></section>';
    PLAN.days.forEach(function (d) {
      html += '<div class="dayhead"><input class="fi" id="dn_' + d.id + '" data-dname="' + d.id + '" type="text" maxlength="30" autocomplete="off" aria-label="Название дня" value="' + esc(d.name) + '">' +
        '<button type="button" class="ib danger" data-ddel="' + d.id + '"' + (PLAN.days.length < 2 ? ' disabled' : '') + '>Удалить день</button></div>' +
        d.ex.map(function (e, i) { return peHtml(e, i, d.ex.length); }).join('') +
        '<div class="btnrow"><button type="button" class="btn ghost" data-padd="' + d.id + '">Добавить упражнение</button></div>';

      '<button type="button" class="btn ghost" data-choose="1">Сменить программу на шаблон</button></div>';
    if (PLAN.archive.length) {
      html += '<p class="sect">Вне плана (история сохранена)</p><section class="card">' + PLAN.archive.map(function (e) {

        return '<div class="lrow"><span>' + esc(e.name) + '</span><span></span><button type="button" class="btn ghost small" data-prestore="' + e.id + '">Добавить в «' + esc(to.name) + '»</button></div>';

  function planField(t, final) {
    var ex = BYID[t.dataset.pex], f = t.dataset.pf;
    if (!ex) return;
    if (f === 'dumbbell' || f === 'bar') ex[f] = t.checked;
    else if (f === 'type') {
      ex.type = TYPES[t.value] ? t.value : 'w';
      if (ex.type !== 'w') ex.bar = false;
      if (ex.type === 'cardio' && !ex.group) ex.group = 'cardio';
      scheduleSave('plan');
      renderPlan();
      return;
    } else if (f === 'group') ex.group = GNAME[t.value] ? t.value : '';
    else if (f === 'name') {
      var nm = t.value.trim().slice(0, 80);
      if (nm) ex.name = nm; else if (final) t.value = ex.name;
    } else {
      var lim = { sets: [1, MAXSETS], lo: [1, 600], hi: [1, 600], step: [0.25, 20], rest: [15, 600] }[f];
      var v = parseNum(t.value);
      if (v != null && v >= lim[0] && v <= lim[1]) ex[f] = f === 'step' ? r2(v) : Math.round(v);
      if (final) {
        if (ex.hi < ex.lo) {
          if (f === 'lo') ex.hi = ex.lo; else ex.lo = ex.hi;
          var o = document.getElementById('p_' + ex.id + '_' + (f === 'lo' ? 'hi' : 'lo'));
          if (o) o.value = f === 'lo' ? ex.hi : ex.lo;
        }
        t.value = fmt(ex[f]);
      }
    }
    scheduleSave('plan');
  }
  function arm(b, key, text) {
    if (armed && armed.key === key) return true;
    disarm();
    armed = { key: key, b: b, text: b.textContent, t: setTimeout(disarm, 3000) };
    b.textContent = text;
    b.classList.add('armed');
    return false;
  }
  function disarm() {
    if (!armed) return;
    clearTimeout(armed.t);
    if (armed.b && armed.b.isConnected) { armed.b.textContent = armed.text; armed.b.classList.remove('armed'); }
    armed = null;
  }
  function planClick(b) {
    var d, i, id, ds = b.dataset;
    if (ds.pmove) {
      id = ds.pid; d = dayById(BYID[id].day); i = d.ex.indexOf(BYID[id]);
      var j = i + (+ds.pmove);
      if (i < 0 || j < 0 || j >= d.ex.length) return;
      d.ex.splice(j, 0, d.ex.splice(i, 1)[0]);
      scheduleSave('plan'); renderPlan();
      var nb = $view.querySelector('[data-pmove="' + ds.pmove + '"][data-pid="' + id + '"]');
      if (nb && !nb.disabled) nb.focus();
      return;
    }
    if (ds.pdel) {
      id = ds.pdel;
      if (!arm(b, 'ex:' + id, 'Точно удалить?')) return;
      disarm();
      var ex = BYID[id]; d = dayById(ex.day);
      d.ex.splice(d.ex.indexOf(ex), 1);
      if (history(id).length) PLAN.archive.push(ex); else noteDirty[id] = '';
      reindex(); scheduleSave('plan'); renderPlan();
      return;
    }
    if (ds.padd) {
      d = dayById(+ds.padd);
      var nx = fixEx({ id: newId(), name: 'Новое упражнение', rest: 90 }, d.id);
      d.ex.push(nx);
      reindex(); scheduleSave('plan'); renderPlan();
      var inp = document.getElementById('p_' + nx.id + '_name');
      if (inp) { inp.focus(); inp.select(); }
      return;
    }
    if (ds.ddel) {
      id = +ds.ddel;
      if (PLAN.days.length < 2) return;
      if (!arm(b, 'day:' + id, 'Точно удалить день?')) return;
      disarm();
      d = dayById(id);
      d.ex.forEach(function (e) { if (history(e.id).length) PLAN.archive.push(e); else noteDirty[e.id] = ''; });
      PLAN.oldDays[id] = d.name;
      PLAN.days = PLAN.days.filter(function (x) { return x.id !== id; });
      if (cur.day === id) { cur.day = PLAN.days[0].id; loadDraft(); }
      reindex(); scheduleSave('plan'); renderPlan();
      return;
    }
    if (ds.dadd) {
      if (PLAN.days.length >= MAXDAYS) return;
      var nid = maxDayId() + 1;
      PLAN.days.push({ id: nid, name: 'День ' + (PLAN.days.length + 1), ex: [] });
      reindex(); scheduleSave('plan'); renderPlan();
      var dn = document.getElementById('dn_' + nid);
      if (dn) { dn.focus(); dn.select(); }
      return;
    }
    if (ds.prestore) {
      id = ds.prestore;
      var k = -1;
      PLAN.archive.forEach(function (e, n) { if (e.id === id) k = n; });
      if (k < 0) return;
      var re = PLAN.archive.splice(k, 1)[0];
      if (dayIndex(re.day) < 0) re.day = PLAN.days[0].id;
      dayById(re.day).ex.push(re);
      reindex(); scheduleSave('plan'); renderPlan();
    }
  }

  /* ---------- замена и добавление упражнения на одну тренировку ---------- */
  function swapConfirm(key) {
    var s = document.getElementById('swsel_' + key), nameInp = document.getElementById('swname_' + key);
    if (!s || !s.value) return;
    var orig = key === '_add' ? null : BYID[key], rid;
    if (s.value === '__new') {
      var nm = nameInp.value.trim().slice(0, 80);
      if (!nm) { nameInp.focus(); return; }
      var base = orig || { type: 'w', group: '', dumbbell: false, sets: 3, lo: 8, hi: 12, step: 2.5, rest: 90 };
      var nx = fixEx({ id: newId(), name: nm, type: base.type, group: base.group, dumbbell: base.dumbbell, sets: base.sets, lo: base.lo, hi: base.hi, step: base.step, rest: base.rest, day: cur.day });
      PLAN.archive.push(nx);
      reindex();
      scheduleSave('plan');
      rid = nx.id;
    } else rid = s.value;
    if (!BYID[rid]) return;
    if (orig) meta.x[orig.id] = rid;
    else if (!draft[rid]) draft[rid] = blank(BYID[rid].sets);
    swapOpen = null;
    dirty = true;
    scheduleSave('sess');
    renderLog();
    var card = $view.querySelector('[data-card="' + rid + '"]');
    if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  /* ---------- копирование и перенос ---------- */
  function tsvCell(v) { return v == null ? '' : String(v).replace(/[\t\r\n]+/g, ' '); }
  function tableText(kind) {
    var rows;
    if (kind === 'body') {
      rows = [['Дата', 'Вес, кг']].concat(BODY.items.map(function (x) { return [x.date, fmt(x.kg)]; }));
    } else {
      rows = [['Дата', 'День', 'Упражнение', 'Тип', 'Подход', 'Вес, кг / км', 'Повторы / сек / мин', 'Ощущение']];
      sessionsSorted().forEach(function (x) {
        var dn = dayById(x.doc.day).name;
        Object.keys(x.doc.entries).forEach(function (k) {
          var e = norm(x.doc.entries[k]), nm = exName(k), fl = e.feel ? FEEL[e.feel] : '', tp = TYPES[exType(k)].name;
          if (filled(e.w)) rows.push([x.doc.date, dn, nm, tp, 'Разминка', fmt(e.w.kg), fmt(e.w.reps), '']);
          e.s.forEach(function (c, i) { if (filled(c)) rows.push([x.doc.date, dn, nm, tp, String(i + 1), fmt(c.kg), fmt(c.reps), fl]); });
        });
      });
    }
    return rows.length < 2 ? '' : rows.map(function (r) { return r.map(tsvCell).join('\t'); }).join('\n');
  }
  /* ---------- удаление тренировки и полный сброс ---------- */
  function deleteSession(id) {
    if (id === curId()) { pend.sess = false; clearTimeout(timers.sess); timers.sess = null; }
    delete S[id];
    if (id === curId()) loadDraft();
    runJob(function () { return kvPut('s_' + id, null); });
  }
  function askConfirm(text, yes) {
    if (inTg && tgAtLeast('6.2')) {
      try { tg.showConfirm(text, function (ok) { if (ok) yes(); }); return; } catch (e) { /* ниже обычное окно */ }
    }
    var ok = true;
    try { ok = window.confirm(text); } catch (e) { ok = true; }
    if (ok) yes();
  }
  function resetAll(withPlan) {
    ['sess', 'plan', 'body'].forEach(function (k) { clearTimeout(timers[k]); timers[k] = null; pend[k] = false; });
    stopRest();
    var del = {}, re = withPlan ? /^(s_|b_|cfg_|n_)/ : /^(s_|b_)/;
    Object.keys(S).forEach(function (id) { del['s_' + id] = 1; });
    BODY.items.forEach(function (x) { del['b_' + x.date.slice(0, 4)] = 1; });
    Object.keys(MIR).forEach(function (k) { if (re.test(k)) del[k] = 1; });
    if (withPlan) {
      del.cfg_plan = 1;
      Object.keys(storedDays).forEach(function (id) { del['cfg_day' + id] = 1; });
      Object.keys(BYID).forEach(function (id) { del['n_' + id] = 1; });
    } else {
      PLAN.archive.forEach(function (e) { if (e.note) noteDirty[e.id] = ''; });
      PLAN.archive = [];
      PLAN.oldDays = {};
      reindex();
    }
    S = {};
    BODY = { items: [] };
    bodyYears = {};
    selEx = null;
    sel = { ex: null, body: null, vol: null };
    histN = 10;
    swapOpen = null;
    userChose = false;
    cur.date = todayStr();
    if (withPlan) {
      noteDirty = {};
      storedDays = {};
      PLAN = cleanPlan(TEMPLATES[0].plan());
      reindex();
      setup = true;
    }
    choosing = false;
    cur.day = PLAN.days[0].id;
    tab = 'log';
    loadDraft();
    runJob(function () {
      var listed = KV.keys().then(function (l) { return l || []; }, function () { return []; });
      return listed.then(function (l) {
        l.forEach(function (k) { if (re.test(k)) del[k] = 1; });
        return Object.keys(del).reduce(function (pr, k) { return pr.then(function () { return kvPut(k, null); }); }, Promise.resolve());
      });
    });
    if (!withPlan) scheduleSave('plan');
    renderAll();
    window.scrollTo(0, 0);
    showNote(withPlan ? 'Все записи и программа удалены. Выберите программу, чтобы начать заново.' : 'Все тренировки и вес тела удалены. Программа осталась, можно начинать заново.');
    haptic();
  }
  function backupText() {
    return JSON.stringify({ format: 'podhody', v: 3, S: S, plan: planDoc(), body: { items: BODY.items } });
  }
  function copyText(text, okMsg, msgId, boxId) {
    var m = document.getElementById(msgId || 'dmsg'), box = boxId ? document.getElementById(boxId) : document.getElementById('copybox');
    function manual() {
      if (box) { box.hidden = false; box.value = text; box.focus(); box.select(); }
      if (m) m.textContent = 'Скопировать автоматически не получилось.' + (box ? ' Текст выделен ниже, скопируйте его вручную.' : '');
    }
    if (box) box.hidden = true;
    if (!text) { if (m) m.textContent = 'Пока нечего копировать.'; return; }
    try { navigator.clipboard.writeText(text).then(function () { if (m) m.textContent = okMsg; haptic(); }, manual); }
    catch (e) { manual(); }
  }
  function shareResult() {
    var text = shareText();
    if (inTg && tgAtLeast('6.1')) {
      try { tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(text)); return; } catch (e) { /* откроем копирование */ }
    }
    copyText(text, 'Итог скопирован, вставьте его в любой чат.', 'smsg', null);
  }
  function doImport() {
    var m = document.getElementById('imsg'), txt = document.getElementById('impbox').value.trim(), o;
    m.className = 'msg';
    try { o = JSON.parse(txt); } catch (e) { m.textContent = 'Не получилось прочитать текст. Скопируйте его целиком ещё раз.'; return; }
    if (!o || o.format !== 'podhody' || !o.S || typeof o.S !== 'object') { m.textContent = 'Это не данные дневника подходов.'; return; }
    flushAll();
    var n = 0, ops = [];
    var np = o.plan ? cleanPlan(o.plan) : null;
    if (np) {
      Object.keys(BYID).forEach(function (id) { noteDirty[id] = ''; });
      PLAN = np; reindex();
      Object.keys(BYID).forEach(function (id) { noteDirty[id] = BYID[id].note || ''; });
      pend.plan = true;
    }
    Object.keys(o.S).forEach(function (key) {
      var d = o.S[key];
      if (!d || !isDate(d.date) || !d.entries || typeof d.entries !== 'object') return;
      var day = Math.round(+d.day) || 1, entries = {};
      Object.keys(d.entries).forEach(function (k) {
        var kk = String(k).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
        if (!kk) return;
        var e = norm(d.entries[k]);
        if (filled(e.w) || lastFilled(e) >= 0) entries[kk] = { w: e.w, s: e.s.slice(0, lastFilled(e) + 1), feel: e.feel };
      });
      var id = d.date + '_d' + day, doc = { date: d.date, day: day, entries: entries };
      if (+d.t0) doc.t0 = +d.t0;
      if (+d.t1) doc.t1 = +d.t1;
      var x = cleanX(d.x);
      if (Object.keys(x).length) doc.x = x;
      S[id] = doc; ops.push(['s_' + id, enc(doc)]); n++;
    });
    if (o.body && Array.isArray(o.body.items)) {
      o.body.items.forEach(function (x) {
        if (!x || !isDate(x.date) || !isFinite(+x.kg)) return;
        BODY.items = BODY.items.filter(function (y) { return y.date !== x.date; });
        BODY.items.push({ date: x.date, kg: r2(+x.kg) });
        bodyYears[x.date.slice(0, 4)] = 1;
      });
      BODY.items.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      pend.body = true;
    }
    if (setup && !np) pend.plan = true;
    setup = false;
    setStatus('saving'); closingGuard(true);
    runJob(function () { return ops.reduce(function (pr, op) { return pr.then(function () { return kvPut(op[0], op[1]); }); }, Promise.resolve()); });
    flush('plan'); flush('body');
    selEx = null; sel = { ex: null, body: null, vol: null };
    userChose = false;
    pickDefaults();
    loadDraft();
    renderAll();
    var mm = document.getElementById('imsg'), done = 'Загружено тренировок: ' + n + '.';
    if (mm) { mm.className = 'msg info'; mm.textContent = done; } else showNote(done);
    haptic('done');
  }

  /* ---------- события ---------- */
  function switchSession(day, date) {
    flushAll();
    cur.day = day; cur.date = date;
    loadDraft();
    renderAll();
    window.scrollTo(0, 0);
  }
  $view.addEventListener('input', function (ev) {
    var t = ev.target, ds = t.dataset || {};
    if (ds.note !== undefined) {
      var ex = BYID[ds.note];
      if (ex) { ex.note = t.value.slice(0, 500); noteDirty[ex.id] = ex.note; scheduleSave('plan'); }
      return;
    }
    if (ds.dname !== undefined) {
      var d = dayById(+ds.dname), nm = t.value.trim().slice(0, 30);
      if (!d.gone && nm) { d.name = nm; scheduleSave('plan'); }
      return;
    }
    if (ds.pex) { if (t.type !== 'checkbox' && t.tagName !== 'SELECT') planField(t, false); return; }
    if (ds.ex && ds.f && tab === 'log') {
      var id = ds.ex, ex2 = BYID[id], e = draft[id] || (draft[id] = blank(ex2 ? ex2.sets : 3)), v = parseNum(t.value);
      if (ds.slot === 'w') e.w[ds.f] = v; else { ensure(e, +ds.slot + 1); e.s[+ds.slot][ds.f] = v; }
      dirty = true;
      autoStart();
      updateCard(id); updateVol();
      if (sbInput === t) showStepbar(t);
      scheduleSave('sess');
    }
  });
  $view.addEventListener('change', function (ev) {
    var t = ev.target, ds = t.dataset || {};
    if (ds.pex) { planField(t, true); return; }
    if (ds.swsel) { var ni = document.getElementById('swname_' + ds.swsel); if (ni) { ni.hidden = t.value !== '__new'; if (!ni.hidden) ni.focus(); } return; }
    if (ds.dname !== undefined) { var d = dayById(+ds.dname); if (!t.value.trim()) t.value = d.name; return; }
    if (t.id === 'set_timer') { PLAN.autoTimer = t.checked; scheduleSave('plan'); return; }
    if (t.id === 'set_goal') { PLAN.goal = num(parseNum(t.value), 1, 7, PLAN.goal, true); t.value = PLAN.goal; scheduleSave('plan'); return; }
    if (t.id === 'set_bar') { PLAN.barKg = num(parseNum(t.value), 0, 50, PLAN.barKg); t.value = fmt(PLAN.barKg); scheduleSave('plan'); return; }
    if (t.id === 'set_plates') { var pl = parsePlates(t.value); if (pl.length) PLAN.plates = pl; t.value = PLAN.plates.map(fmt).join(' '); scheduleSave('plan'); return; }
    if (ds.ex && ds.f && tab === 'log') rowCheck(t);
  });
  $view.addEventListener('focusin', function (ev) {
    var t = ev.target;
    if (t.classList && t.classList.contains('n')) showStepbar(t);
  });
  $view.addEventListener('focusout', function (ev) {
    var t = ev.target;
    if (!(t.classList && t.classList.contains('n'))) return;
    rowCheck(t);
    setTimeout(function () {
      var a = document.activeElement;
      if (!(a && a.classList && a.classList.contains('n'))) hideStepbar();
    }, 60);
  });
  $view.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var t = ev.target;
    if (!t.classList || !t.classList.contains('n')) return;
    ev.preventDefault();
    var list = [].slice.call($view.querySelectorAll('input.n'));
    var i = list.indexOf(t);
    if (i >= 0 && i < list.length - 1) list[i + 1].focus(); else t.blur();
  });
  $view.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'bodyform') return;
    ev.preventDefault();
    var kg = parseNum(document.getElementById('bkg').value);
    var d = document.getElementById('bdate').value || todayStr();
    if (kg == null || kg < 25 || kg > 300) { document.getElementById('bmsg').textContent = 'Введите вес от 25 до 300 кг.'; return; }
    BODY.items = BODY.items.filter(function (x) { return x.date !== d; });
    BODY.items.push({ date: d, kg: r2(kg) });
    BODY.items.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    bodyYears[d.slice(0, 4)] = 1;
    sel.body = null;
    scheduleSave('body');
    renderOver();
  });
  $view.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    var hit = ev.target.closest('[data-pt]');
    if (hit && !b) { sel[hit.getAttribute('data-chart')] = +hit.getAttribute('data-pt'); renderTab(); return; }
    if (!b) return;
    var ds = b.dataset, id, e, prev, ex, i;
    if (ds.reload) { location.reload(); return; }
    if (ds.tpl) { applyTemplate(ds.tpl); haptic('done'); return; }
    if (ds.cancel) { choosing = false; renderAll(); return; }
    if (ds.choose) { flushAll(); choosing = true; renderAll(); window.scrollTo(0, 0); return; }
    if (ds.goplan) { tab = 'plan'; renderAll(); return; }
    if (ds.start) { meta.t0 = Date.now(); meta.t1 = null; dirty = true; scheduleSave('sess'); updateHead(); haptic('tap'); return; }
    if (ds.finish) {
      if (!meta.t0) return;
      meta.t1 = Date.now(); dirty = true; pend.sess = true; flush('sess');
      stopRest(); renderLog(); window.scrollTo(0, 0); haptic('done');
      return;
    }
    if (ds.resume) { meta.t1 = null; dirty = true; scheduleSave('sess'); renderLog(); return; }
    if (ds.share) { shareResult(); return; }
    if (ds.swap) { swapOpen = ds.swap; renderLog(); var sp = document.getElementById('swsel_' + ds.swap); if (sp) sp.focus(); return; }
    if (ds.swapno) { swapOpen = null; renderLog(); return; }
    if (ds.swapok) { swapConfirm(ds.swapok); return; }
    if (ds.unswap) { delete meta.x[ds.unswap]; dirty = true; scheduleSave('sess'); renderLog(); return; }
    if (ds.copy) {
      id = ds.copy; prev = prevEntry(id); ex = BYID[id];
      if (!prev) return;
      e = draft[id] || (draft[id] = blank(ex ? ex.sets : 3));
      var n = $view.querySelectorAll('input[data-ex="' + id + '"][data-f="kg"]:not([data-slot="w"])').length;
      var pairs = [['w', prev.entry.w]];
      for (i = 0; i < Math.min(n, prev.entry.s.length); i++) pairs.push([i, prev.entry.s[i]]);
      pairs.forEach(function (p) {
        if (p[0] !== 'w') ensure(e, p[0] + 1);
        ['kg', 'reps'].forEach(function (f) {
          var cell = p[0] === 'w' ? e.w : e.s[p[0]];
          if (cell[f] == null && p[1][f] != null) {
            cell[f] = p[1][f];
            var inp = document.getElementById('i_' + id + '_' + p[0] + '_' + f);
            if (inp) inp.value = fmt(p[1][f]);
          }
        });
      });
      dirty = true; autoStart(); updateCard(id); updateVol(); scheduleSave('sess');
      return;
    }
    if (ds.sug) {
      id = ds.sug; ex = BYID[id];
      var sg = ex && suggest(ex, prevList(id));
      if (!sg) return;
      e = draft[id] || (draft[id] = blank(ex.sets));
      ensure(e, ex.sets);
      if (TYPES[ex.type].warm) {
        var wkg = roundTo(sg.kg * 0.5, ex.dumbbell ? 1 : 2.5);
        if (e.w.kg == null && wkg > 0) { e.w.kg = wkg; var wi = document.getElementById('i_' + id + '_w_kg'); if (wi) wi.value = fmt(wkg); }
      }
      for (i = 0; i < ex.sets; i++) {
        if (e.s[i].kg == null) { e.s[i].kg = sg.kg; var si = document.getElementById('i_' + id + '_' + i + '_kg'); if (si) si.value = fmt(sg.kg); }
      }
      dirty = true; autoStart(); updateCard(id); updateVol(); scheduleSave('sess');
      return;
    }
    if (ds.feel) {
      id = ds.fex; ex = BYID[id]; e = draft[id] || (draft[id] = blank(ex ? ex.sets : 3));
      var v = +ds.feel;
      e.feel = e.feel === v ? null : v;
      [].forEach.call(b.parentNode.querySelectorAll('button[data-feel]'), function (x) { x.setAttribute('aria-pressed', String(+x.dataset.feel === e.feel)); });
      haptic();
      dirty = true; scheduleSave('sess');
      return;
    }
    if (ds.sel) { selEx = ds.sel; sel.ex = null; renderProg(); window.scrollTo(0, 0); return; }
    if (ds.cal || ds.open) {
      var dd = ds.cal, dayId;
      if (ds.open) { var od = S[ds.open]; if (!od) return; dd = od.date; dayId = od.day; }
      else { var onDay = sessionsSorted().filter(function (x) { return x.doc.date === dd; }); dayId = onDay.length ? onDay[onDay.length - 1].doc.day : nextDay(); }
      userChose = true;
      tab = 'log';
      switchSession(dayId, dd);
      return;
    }
    if (ds.sdelcur) {
      if (!arm(b, 'cur:' + curId(), 'Точно удалить тренировку?')) return;
      disarm();
      deleteSession(curId());
      stopRest();
      renderAll();
      showNote('Тренировка удалена.');
      window.scrollTo(0, 0);
      return;
    }
    if (ds.reset) {
      var withPlan = !!(document.getElementById('rs_plan') || {}).checked;
      if (!arm(b, 'reset', withPlan ? 'Удалить всё вместе с программой? Нажмите ещё раз' : 'Удалить все тренировки и вес? Нажмите ещё раз')) return;
      disarm();
      askConfirm(withPlan ? 'Удалить все тренировки, вес тела и программу? Отменить это нельзя.' : 'Удалить все тренировки и вес тела? Программа останется. Отменить это нельзя.', function () { resetAll(withPlan); });
      return;
    }
    if (ds.sdel) {
      id = ds.sdel;
      if (!arm(b, 's:' + id, 'Удалить?')) return;
      disarm();
      deleteSession(id);
      renderOver();
      return;
    }
    if (ds.more) { histN += 20; renderOver(); return; }
    if (ds.bdel) {
      BODY.items = BODY.items.filter(function (x) { return x.date !== ds.bdel; });
      bodyYears[ds.bdel.slice(0, 4)] = 1;
      sel.body = null; scheduleSave('body'); renderOver();
      return;
    }
    if (ds.cp) {
      if (ds.cp === 'backup') copyText(backupText(), 'Резервная копия скопирована. Отправьте её себе в «Избранное» Телеграма.', ds.cpm, ds.cpm ? 'rbox' : undefined);
      else copyText(tableText(ds.cp), 'Таблица скопирована, вставьте её в Excel или Google Таблицы.');
      return;
    }
    if (ds.import) { doImport(); return; }
    if (ds.pmove || ds.pdel || ds.padd || ds.prestore || ds.ddel || ds.dadd) planClick(b);
  });
  $seg.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-day]');
    if (!b) return;
    var d = +b.dataset.day;
    if (d === cur.day) return;
    userChose = true;
    haptic();
    switchSession(d, cur.date);
  });
  $datein.addEventListener('change', function () { userChose = true; switchSession(cur.day, $datein.value || cur.date); });
  document.getElementById('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]');
    if (!b || b.dataset.tab === tab) return;
    flushAll();
    disarm();
    haptic();
    tab = b.dataset.tab;
    swapOpen = null;
    if (tab === 'log' && !dirty) loadDraft();
    renderAll();
    window.scrollTo(0, 0);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushAll();
    else { if (T.iv) lockScreen(); flushOutbox(); }
  });
  window.addEventListener('pagehide', flushAll);

  boot();
})();
</script>
</body>
</html>
