  /* ---------- план ---------- */
  function peHtml(ex, i, n) {
    function f(name, label, val, im) {
      return '<label>' + label + '<input class="fi" id="p_' + ex.id + '_' + name + '" data-pex="' + ex.id + '" data-pf="' + name + '" type="text" inputmode="' + im + '" autocomplete="off" value="' + fmt(val) + '"></label>';
    }
    return '<div class="pe">' +
      '<input class="fi pname" id="p_' + ex.id + '_name" data-pex="' + ex.id + '" data-pf="name" type="text" autocomplete="off" maxlength="80" aria-label="' + esc(t('ex_name')) + '" value="' + esc(ex.name) + '">' +
      '<div class="pgrid">' + f('sets', t('p_sets'), ex.sets, 'numeric') + f('lo', t('p_lo'), ex.lo, 'numeric') + f('hi', t('p_hi'), ex.hi, 'numeric') +
      f('step', ex.bw ? t('p_step_bw') : t('p_step'), ex.step, 'decimal') + f('rest', t('p_rest'), ex.rest, 'numeric') + '</div>' +
      '<div class="prow"><span class="chks"><label class="chk"><input type="checkbox" id="p_' + ex.id + '_bw" data-pex="' + ex.id + '" data-pf="bw"' + (ex.bw ? ' checked' : '') + '>' + t('p_bw') + '</label>' +
      '<label class="chk"><input type="checkbox" id="p_' + ex.id + '_db" data-pex="' + ex.id + '" data-pf="dumbbell"' + (ex.dumbbell ? ' checked' : '') + '>' + t('p_db') + '</label></span>' +
      '<span class="pbtns"><button type="button" class="ib" data-pmove="-1" data-pid="' + ex.id + '" aria-label="' + esc(t('up')) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
      '<button type="button" class="ib" data-pmove="1" data-pid="' + ex.id + '" aria-label="' + esc(t('down')) + '"' + (i === n - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button type="button" class="ib danger" data-pdel="' + ex.id + '">' + t('delete') + '</button></span></div></div>';
  }
  function pickerHtml(d) {
    var have = {};
    d.ex.forEach(function (e) { have[e.name.toLowerCase()] = 1; });
    var chips = CATALOG.map(function (c, i) {
      var nm = PREFS.lang === 'en' ? c[1] : c[0];
      if (have[nm.toLowerCase()]) return '';
      return '<button type="button" class="qchip" data-qadd="' + i + '" data-qday="' + d.id + '">' + esc(nm) + (c[2].bw ? ' <span class="bwtag">' + t('bw_tag') + '</span>' : '') + '</button>';
    }).join('');
    return '<div class="picker"><p class="sub">' + t('pick_sub') + '</p><div class="qchips">' + chips + '</div>' +
      '<div class="btnrow"><button type="button" class="btn" data-padd="' + d.id + '">' + t('own_ex') + '</button><button type="button" class="btn ghost" data-pclose="1">' + t('close') + '</button></div></div>';
  }
  function renderPlan() {
    var html = '<details class="card"><summary>' + t('how_use') + '</summary><ul class="how">' +
      '<li>' + t('hu1') + '</li><li>' + t('hu2') + '</li><li>' + t('hu3') + '</li><li>' + t('hu4') + '</li><li>' + t('hu5') + '</li></ul></details>';
    PLAN.days.forEach(function (d) {
      html += '<div class="dayhead"><input class="fi" id="dn_' + d.id + '" data-dname="' + d.id + '" type="text" maxlength="30" autocomplete="off" aria-label="' + esc(t('day_name')) + '" value="' + esc(d.name) + '">' +
        '<button type="button" class="ib danger" data-ddel="' + d.id + '"' + (PLAN.days.length < 2 ? ' disabled' : '') + '>' + t('del_day') + '</button></div>' +
        (d.ex.length ? '' : '<p class="sub">' + t('day_noex') + '</p>') +
        d.ex.map(function (e, i) { return peHtml(e, i, d.ex.length); }).join('') +
        (pickDay === d.id ? pickerHtml(d) : '<div class="btnrow"><button type="button" class="btn ghost" data-popen="' + d.id + '">' + t('add_ex') + '</button></div>');
    });
    html += '<div class="btnrow" style="margin-top:22px">' +
      (PLAN.days.length < MAXDAYS ? '<button type="button" class="btn" data-dadd="1">' + t('add_day') + '</button>' : '') + '</div>';
    if (PLAN.archive.length) {
      html += '<p class="sect">' + t('removed_hist') + '</p><section class="card">' + PLAN.archive.map(function (e) {
        var to = dayIndex(e.day) >= 0 ? dayById(e.day) : PLAN.days[0];
        return '<div class="lrow"><span>' + esc(e.name) + '</span><span></span><button type="button" class="btn ghost small" data-prestore="' + e.id + '">' + t('restore_to', { d: esc(to.name) }) + '</button></div>';
      }).join('') + '</section>';
    }
    $view.innerHTML = html;
  }
  function planField(tEl, final) {
    var ex = BYID[tEl.dataset.pex], f = tEl.dataset.pf;
    if (!ex) return;
    if (f === 'dumbbell') ex.dumbbell = tEl.checked;
    else if (f === 'bw') { ex.bw = tEl.checked; scheduleSave('plan'); renderPlan(); return; }
    else if (f === 'name') {
      var nm = tEl.value.trim().slice(0, 80);
      if (nm) ex.name = nm; else if (final) tEl.value = ex.name;
    } else {
      var lim = { sets: [1, MAXSETS], lo: [1, 100], hi: [1, 100], step: [0.25, 20], rest: [15, 600] }[f];
      var v = parseNum(tEl.value);
      if (v != null && v >= lim[0] && v <= lim[1]) ex[f] = f === 'step' ? r2(v) : Math.round(v);
      if (final) {
        if (ex.hi < ex.lo) {
          if (f === 'lo') ex.hi = ex.lo; else ex.lo = ex.hi;
          var o = document.getElementById('p_' + ex.id + '_' + (f === 'lo' ? 'hi' : 'lo'));
          if (o) o.value = f === 'lo' ? ex.hi : ex.lo;
        }
        tEl.value = fmt(ex[f]);
      }
    }
    scheduleSave('plan');
  }
  function arm(b, key, text) {
    if (armed && armed.key === key) return true;
    disarm();
    armed = { key: key, b: b, text: b.textContent, t: setTimeout(disarm, 3000) };
    b.textContent = text;
    b.classList.add('armed');
    return false;
  }
  function disarm() {
    if (!armed) return;
    clearTimeout(armed.t);
    if (armed.b && armed.b.isConnected) { armed.b.textContent = armed.text; armed.b.classList.remove('armed'); }
    armed = null;
  }
  function addExercise(d, o, focus) {
    var nx = fixEx(Object.assign({ id: newId(), rest: 90 }, o), d.id);
    d.ex.push(nx);
    reindex(); scheduleSave('plan'); renderPlan();
    if (focus) {
      var inp = document.getElementById('p_' + nx.id + '_name');
      if (inp) { inp.focus(); inp.select(); }
    }
  }
  function planClick(b) {
    var d, i, id, ds = b.dataset;
    if (ds.pmove) {
      id = ds.pid; d = dayById(BYID[id].day); i = d.ex.indexOf(BYID[id]);
      var j = i + (+ds.pmove);
      if (i < 0 || j < 0 || j >= d.ex.length) return;
      d.ex.splice(j, 0, d.ex.splice(i, 1)[0]);
      scheduleSave('plan'); renderPlan();
      var nb = $view.querySelector('[data-pmove="' + ds.pmove + '"][data-pid="' + id + '"]');
      if (nb && !nb.disabled) nb.focus();
      return;
    }
    if (ds.pdel) {
      id = ds.pdel;
      if (!arm(b, 'ex:' + id, t('sure'))) return;
      disarm();
      var ex = BYID[id]; d = dayById(ex.day);
      d.ex.splice(d.ex.indexOf(ex), 1);
      if (history(id).length) PLAN.archive.push(ex); else noteDirty[id] = '';
      reindex(); scheduleSave('plan'); renderPlan();
      return;
    }
    if (ds.popen) { pickDay = +ds.popen; renderPlan(); return; }
    if (ds.pclose) { pickDay = null; renderPlan(); return; }
    if (ds.qadd) {
      var c = CATALOG[+ds.qadd];
      d = dayById(+ds.qday);
      if (c) { addExercise(d, Object.assign({ name: PREFS.lang === 'en' ? c[1] : c[0] }, c[2]), false); haptic(); }
      return;
    }
    if (ds.padd) {
      pickDay = null;
      addExercise(dayById(+ds.padd), { name: t('ex_new') }, true);
      return;
    }
    if (ds.ddel) {
      id = +ds.ddel;
      if (PLAN.days.length < 2) return;
      if (!arm(b, 'day:' + id, t('sure_day'))) return;
      disarm();
      d = dayById(id);
      d.ex.forEach(function (e) { if (history(e.id).length) PLAN.archive.push(e); else noteDirty[e.id] = ''; });
      PLAN.oldDays[id] = d.name;
      PLAN.days = PLAN.days.filter(function (x) { return x.id !== id; });
      if (cur.day === id) { cur.day = PLAN.days[0].id; loadDraft(); }
      reindex(); scheduleSave('plan'); renderPlan();
      return;
    }
    if (ds.dadd) {
      if (PLAN.days.length >= MAXDAYS) return;
      var nid = maxDayId() + 1;
      PLAN.days.push({ id: nid, name: t('day_n', { n: PLAN.days.length + 1 }), ex: [] });
      pickDay = nid;
      reindex(); scheduleSave('plan'); renderPlan();
      var dn = document.getElementById('dn_' + nid);
      if (dn) { dn.focus(); dn.select(); }
      return;
    }
    if (ds.prestore) {
      id = ds.prestore;
      var k = -1;
      PLAN.archive.forEach(function (e, n) { if (e.id === id) k = n; });
      if (k < 0) return;
      var re = PLAN.archive.splice(k, 1)[0];
      if (dayIndex(re.day) < 0) re.day = PLAN.days[0].id;
      dayById(re.day).ex.push(re);
      reindex(); scheduleSave('plan'); renderPlan();
    }
  }

  /* ---------- копирование и перенос ---------- */
  function tableText(kind) {
    var rows;
    if (kind === 'body') {
      rows = [[t('col_date'), t('col_kg')]].concat(BODY.items.map(function (x) { return [x.date, Core.fmt(x.kg)]; }));
    } else {
      rows = Core.workoutRows(sessionsSorted(), function (d) { return dayById(d).name; }, exName, PREFS.lang);
    }
    return Core.toTsv(rows);
  }
  function backupText() {
    return JSON.stringify({ format: 'podhody', v: 2, S: S, plan: planDoc(), body: { items: BODY.items }, prefs: PREFS });
  }
  function copyText(text, okMsg) {
    var m = document.getElementById('dmsg'), box = document.getElementById('copybox');
    function manual() {
      box.hidden = false; box.value = text; box.focus(); box.select();
      m.textContent = t('copy_manual');
    }
    box.hidden = true;
    if (!text) { m.textContent = t('copy_nothing'); return; }
    try { navigator.clipboard.writeText(text).then(function () { m.textContent = okMsg; haptic(); }, manual); }
    catch (e) { manual(); }
  }
  function doImport() {
    var m = document.getElementById('imsg'), txt = document.getElementById('impbox').value.trim(), o;
    m.className = 'msg';
    try { o = JSON.parse(txt); } catch (e) { m.textContent = t('imp_bad'); return; }
    if (!o || o.format !== 'podhody' || !o.S || typeof o.S !== 'object') { m.textContent = t('imp_foreign'); return; }
    flushAll();
    var n = 0, ops = [];
    if (o.prefs) { PREFS = cleanPrefs(o.prefs); savePrefs(); applyTheme(); applyStatic(); showNote(); }
    var np = o.plan ? cleanPlan(o.plan) : null;
    if (np) {
      Object.keys(BYID).forEach(function (id) { noteDirty[id] = ''; });
      PLAN = np; reindex();
      Object.keys(BYID).forEach(function (id) { noteDirty[id] = BYID[id].note || ''; });
      pend.plan = true;
    }
    Object.keys(o.S).forEach(function (key) {
      var d = o.S[key];
      if (!d || !isDate(d.date) || !d.entries || typeof d.entries !== 'object') return;
      var day = Math.round(+d.day) || 1, entries = {};
      Object.keys(d.entries).forEach(function (k) {
        var kk = String(k).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
        if (!kk) return;
        var e = norm(d.entries[k]);
        if (filled(e.w) || lastFilled(e) >= 0) entries[kk] = { w: e.w, s: e.s.slice(0, lastFilled(e) + 1), feel: e.feel };
      });
      var id = d.date + '_d' + day, doc = { date: d.date, day: day, entries: entries };
      S[id] = doc; ops.push(['s_' + id, enc(doc)]); n++;
    });
    if (o.body && Array.isArray(o.body.items)) {
      o.body.items.forEach(function (x) {
        if (!x || !isDate(x.date) || !isFinite(+x.kg)) return;
        BODY.items = BODY.items.filter(function (y) { return y.date !== x.date; });
        BODY.items.push({ date: x.date, kg: r2(+x.kg) });
        bodyYears[x.date.slice(0, 4)] = 1;
      });
      BODY.items.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      pend.body = true;
    }
    if (setup && !np) pend.plan = true;
    setup = false;
    setStatus('saving'); closingGuard(true);
    runJob(function () { return ops.reduce(function (pr, op) { return pr.then(function () { return kvSet(op[0], op[1]); }); }, Promise.resolve()); });
    flush('plan'); flush('body'); flush('prefs');
    selEx = null; sel = { ex: null, body: null, vol: null, wk: null };
    userChose = false;
    pickDefaults();
    loadDraft();
    renderAll();
    var mm = document.getElementById('imsg'), done = t('imp_done', { n: n });
    if (mm) { mm.className = 'msg info'; mm.textContent = done; } else showNote(done);
    haptic('done');
  }

  /* ---------- удаление тренировок ---------- */
  function deleteSession(id) {
    flushAll();
    delete S[id];
    runJob(function () { return KV.del('s_' + id); });
    if (id === curId()) loadDraft();
    sel.vol = null; sel.ex = null;
    haptic('done');
    showNote(t('workout_deleted'));
  }

  /* ---------- события ---------- */
  function switchSession(day, date) {
    flushAll();
    cur.day = day; cur.date = date;
    loadDraft();
    renderAll();
    window.scrollTo(0, 0);
  }
  function goTab(x) {
    flushAll();
    disarm();
    tab = x;
    if (tab === 'log' && !dirty) loadDraft();
    renderAll();
    window.scrollTo(0, 0);
  }
  $view.addEventListener('input', function (ev) {
    var tEl = ev.target, ds = tEl.dataset || {};
    if (ds.note !== undefined) {
      var ex = BYID[ds.note];
      if (ex) { ex.note = tEl.value.slice(0, 500); noteDirty[ex.id] = ex.note; scheduleSave('plan'); }
      return;
    }
    if (ds.dname !== undefined) {
      var d = dayById(+ds.dname), nm = tEl.value.trim().slice(0, 30);
      if (!d.gone && nm) { d.name = nm; scheduleSave('plan'); }
      return;
    }
    if (ds.pex) { if (tEl.type !== 'checkbox') planField(tEl, false); return; }
    if (ds.ex && ds.f && tab === 'log') {
      var id = ds.ex, ex2 = BYID[id], e = draft[id] || (draft[id] = blank(ex2 ? ex2.sets : 3)), v = parseNum(tEl.value);
      if (ds.slot === 'w') e.w[ds.f] = v; else { ensure(e, +ds.slot + 1); e.s[+ds.slot][ds.f] = v; }
      dirty = true;
      updateCard(id); updateVol(); updateProgress();
      scheduleSave('sess');
      scheduleAdvance(tEl);
    }
  });
  $view.addEventListener('change', function (ev) {
    var tEl = ev.target, ds = tEl.dataset || {};
    if (ds.pex) { planField(tEl, true); return; }
    if (ds.dname !== undefined) { var d = dayById(+ds.dname); if (!tEl.value.trim()) tEl.value = d.name; return; }
    if (tEl.id === 'set_timer') { PLAN.autoTimer = tEl.checked; scheduleSave('plan'); return; }
    if (tEl.id === 'set_next') { PREFS.autoNext = tEl.checked; savePrefs(); return; }
    if (tEl.id === 'set_remind') { PREFS.remind = tEl.checked; savePrefs(); return; }
    if (tEl.id === 'set_goal') { PLAN.goal = num(parseNum(tEl.value), 1, 7, PLAN.goal, true); tEl.value = PLAN.goal; scheduleSave('plan'); return; }
    if (tEl.id === 'set_h') {
      var h = parseNum(tEl.value), m = document.getElementById('setmsg');
      if (!tEl.value.trim()) { PREFS.height = null; savePrefs(); m.textContent = ''; return; }
      if (!validH(h)) { m.textContent = t('err_height'); return; }
      m.textContent = ''; PREFS.height = Math.round(h); tEl.value = PREFS.height; savePrefs();
      return;
    }
    if (ds.ex && ds.f && tab === 'log') {
      var row = tEl.closest('.row'), e = draft[ds.ex], ex = BYID[ds.ex];
      if (!row || !e) return;
      var cell = ds.slot === 'w' ? e.w : e.s[+ds.slot];
      if (!cell) return;
      var done = isDone(ex, cell);
      if (done && row.dataset.timed !== '1') {
        row.dataset.timed = '1';
        haptic();
        if (PLAN.autoTimer && row.dataset.last !== '1') startRest(ds.slot === 'w' ? 60 : (ex ? ex.rest : 150));
      } else if (!done) row.dataset.timed = '';
    }
  });
  $view.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var tEl = ev.target;
    if (!tEl.classList || !tEl.classList.contains('n')) return;
    ev.preventDefault();
    advance(tEl, true);
  });
  $view.addEventListener('submit', function (ev) {
    var id = ev.target.id;
    if (id === 'setupform') { ev.preventDefault(); finishSetup(); return; }
    if (id === 'askform') { ev.preventDefault(); submitAsk(); return; }
    if (id !== 'bodyform') return;
    ev.preventDefault();
    var kg = parseNum(document.getElementById('bkg').value);
    var d = document.getElementById('bdate').value || todayStr();
    if (!validKg(kg)) { document.getElementById('bmsg').textContent = t('err_weight'); return; }
    addBody(d, kg);
    renderOver();
  });
  $view.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    var hit = ev.target.closest('[data-pt]');
    if (hit && !b) { sel[hit.getAttribute('data-chart')] = +hit.getAttribute('data-pt'); renderTab(); return; }
    if (!b) return;
    var ds = b.dataset, id, e, prev, ex, i;
    if (ds.lang) {
      if (PREFS.lang === ds.lang) return;
      PREFS.lang = ds.lang; savePrefs(); applyStatic(); showNote(); setStatus(anyPending() ? 'saving' : 'saved'); renderAll(); haptic();
      return;
    }
    if (ds.thm) { PREFS.theme = ds.thm; savePrefs(); applyTheme(); renderSettings(); haptic(); return; }
    if (ds.acc) { PREFS.accent = ds.acc; savePrefs(); applyTheme(); renderSettings(); haptic(); return; }
    if (ds.wkm) { metric.wk = ds.wkm; renderProg(); return; }
    if (ds.exm) { metric.ex = ds.exm; sel.ex = null; renderProg(); var c = document.getElementById('excard'); if (c) c.scrollIntoView({ block: 'nearest' }); return; }
    if (ds.later) { laterAsk = true; renderTab(); return; }
    if (ds.goweigh) { goTab('over'); var bc = document.getElementById('bkg'); if (bc) { bc.scrollIntoView({ block: 'center' }); bc.focus(); } return; }
    if (ds.goplan) { goTab('plan'); return; }
    if (ds.open) {
      var doc = S[ds.open];
      if (!doc) return;
      userChose = true; tab = 'log';
      switchSession(doc.day, doc.date);
      return;
    }
    if (ds.sxdel) {
      if (!arm(b, 'sx:' + ds.sxdel, t('del_q'))) return;
      disarm();
      deleteSession(ds.sxdel);
      renderOver();
      return;
    }
    if (ds.sdel) {
      if (!arm(b, 'sdel', t('sure_workout'))) return;
      disarm();
      clearTimeout(timers.sess); pend.sess = false;
      deleteSession(curId());
      stopRest();
      renderAll();
      return;
    }
    if (ds.clr) {
      id = ds.clr;
      if (!arm(b, 'clr:' + id, t('sure'))) return;
      disarm();
      delete draft[id]; delete extra[id];
      dirty = true; scheduleSave('sess');
      renderLog();
      return;
    }
    if (ds.addset) {
      id = ds.addset; ex = BYID[id];
      if (!ex) return;
      e = draft[id] || (draft[id] = blank(ex.sets));
      extra[id] = rowsFor(ex, e) + 1 - ex.sets;
      renderLog();
      var ni = document.getElementById('i_' + id + '_' + (rowsFor(ex, e) - 1) + '_' + (ex.bw ? 'reps' : 'kg'));
      if (ni) ni.focus();
      return;
    }
    if (ds.copy) {
      id = ds.copy; prev = prevEntry(id); ex = BYID[id];
      if (!prev) return;
      e = draft[id] || (draft[id] = blank(ex ? ex.sets : 3));
      var n = $view.querySelectorAll('input[data-ex="' + id + '"][data-f="kg"]').length - (ex && ex.bw ? 0 : 1);
      var pairs = [['w', prev.entry.w]];
      for (i = 0; i < Math.min(n, prev.entry.s.length); i++) pairs.push([i, prev.entry.s[i]]);
      pairs.forEach(function (p) {
        if (p[0] !== 'w') ensure(e, p[0] + 1);
        ['kg', 'reps'].forEach(function (f) {
          var cell = p[0] === 'w' ? e.w : e.s[p[0]];
          if (cell[f] == null && p[1][f] != null) {
            cell[f] = p[1][f];
            var inp = document.getElementById('i_' + id + '_' + p[0] + '_' + f);
            if (inp) inp.value = fmt(p[1][f]);
          }
        });
      });
      dirty = true; updateCard(id); updateVol(); updateProgress(); scheduleSave('sess');
      return;
    }
    if (ds.sug) {
      id = ds.sug; ex = BYID[id]; prev = prevEntry(id);
      var sg = ex && suggest(ex, prev);
      if (!sg) return;
      e = draft[id] || (draft[id] = blank(ex.sets));
      ensure(e, ex.sets);
      var wkg = roundTo(sg.kg * 0.5, ex.dumbbell ? 1 : 2.5);
      if (e.w.kg == null && wkg > 0) { e.w.kg = wkg; var wi = document.getElementById('i_' + id + '_w_kg'); if (wi) wi.value = fmt(wkg); }
      for (i = 0; i < ex.sets; i++) {
        if (e.s[i].kg == null) { e.s[i].kg = sg.kg; var si = document.getElementById('i_' + id + '_' + i + '_kg'); if (si) si.value = fmt(sg.kg); }
      }
      dirty = true; updateCard(id); updateVol(); updateProgress(); scheduleSave('sess');
      var fr = document.getElementById('i_' + id + '_' + (e.w.reps == null && wkg > 0 ? 'w' : '0') + '_reps');
      if (fr && !fr.value) fr.focus();
      return;
    }
    if (ds.feel) {
      id = ds.fex; ex = BYID[id]; e = draft[id] || (draft[id] = blank(ex ? ex.sets : 3));
      var v = +ds.feel;
      e.feel = e.feel === v ? null : v;
      [].forEach.call(b.parentNode.querySelectorAll('button[data-feel]'), function (x) { x.setAttribute('aria-pressed', String(+x.dataset.feel === e.feel)); });
      haptic();
      dirty = true; scheduleSave('sess');
      return;
    }
    if (ds.sel) { selEx = ds.sel; sel.ex = null; renderProg(); var xc = document.getElementById('excard'); if (xc) xc.scrollIntoView({ block: 'start' }); return; }
    if (ds.cal) {
      var dd = ds.cal, onDay = sessionsSorted().filter(function (x) { return x.doc.date === dd; });
      userChose = true;
      tab = 'log';
      switchSession(onDay.length ? onDay[onDay.length - 1].doc.day : nextDay(), dd);
      return;
    }
    if (ds.bdel) {
      BODY.items = BODY.items.filter(function (x) { return x.date !== ds.bdel; });
      bodyYears[ds.bdel.slice(0, 4)] = 1;
      sel.body = null; scheduleSave('body'); renderOver();
      return;
    }
    if (ds.cp) {
      if (ds.cp === 'backup') copyText(backupText(), t('cp_backup_ok'));
      else copyText(tableText(ds.cp), t('cp_table_ok'));
      return;
    }
    if (ds['import']) { doImport(); return; }
    if (ds.pmove || ds.pdel || ds.padd || ds.prestore || ds.ddel || ds.dadd || ds.popen || ds.pclose || ds.qadd) planClick(b);
  });
  $seg.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-day]');
    if (!b) return;
    var d = +b.dataset.day;
    if (d === cur.day) return;
    userChose = true;
    haptic();
    switchSession(d, cur.date);
  });
  $datein.addEventListener('change', function () { userChose = true; switchSession(cur.day, $datein.value || cur.date); });
  document.getElementById('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]');
    if (!b || b.dataset.tab === tab) return;
    haptic();
    goTab(b.dataset.tab);
  });
  document.getElementById('setbtn').addEventListener('click', function () { haptic(); goTab(tab === 'set' ? 'log' : 'set'); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushAll();
    else if (T.iv) lockScreen();
  });
  window.addEventListener('pagehide', flushAll);

  boot();
})();
</script>
</body>
